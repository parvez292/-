<!DOCTYPE html>
<html lang="bn" data-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0e3b36" id="metaTheme">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>অর্থ কুটির · Ortho Kutir</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ========== ডিজাইন টোকেন (লাইট/ডার্ক) ========== */
        :root {
            --bg: #eef3f0;
            --surface: rgba(255, 255, 255, .82);
            --solid: #fff;
            --text: #10231f;
            --muted: #5b716b;
            --border: #dbe6e1;
            --primary: #0e5c52;
            --primary2: #13806f;
            --accent: #f2a900;
            --income: #0f9d6b;
            --expense: #d9483b;
            --warn: #e08a00;
            --shadow: 0 6px 24px rgba(14, 59, 54, .08);
            --r: 16px;
            --hero1: #0e3b36;
            --hero2: #0f6b5c
        }

        [data-theme=dark] {
            --bg: #08120f;
            --surface: rgba(18, 33, 29, .82);
            --solid: #12211d;
            --text: #e6f2ee;
            --muted: #8fa8a1;
            --border: #22382f;
            --primary: #3ec9a7;
            --primary2: #2aa88a;
            --accent: #f5b83a;
            --income: #3fd39a;
            --expense: #ff7a6b;
            --warn: #f5b83a;
            --shadow: 0 6px 24px rgba(0, 0, 0, .45);
            --hero1: #0b2a26;
            --hero2: #116355
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            min-width: 0
        }

        [hidden] {
            display: none !important
        }

        html {
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
            width: 100%
        }

        body {
            font-family: 'Hind Siliguri', 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-wrap: break-word;
            -webkit-tap-highlight-color: transparent
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(700px 320px at 0% -5%, rgba(19, 128, 111, .22), transparent), radial-gradient(520px 300px at 100% 0%, rgba(242, 169, 0, .14), transparent)
        }

        body.lock {
            overflow: hidden
        }

        h1,
        h2,
        h3,
        .brand b,
        .hero .big {
            font-family: 'Bricolage Grotesque', 'Hind Siliguri', sans-serif
        }

        h3 {
            font-size: 1.02rem;
            margin-bottom: 10px
        }

        a {
            color: inherit;
            text-decoration: none
        }

        small {
            color: var(--muted);
            font-size: .8rem
        }

        button {
            font-family: inherit
        }

        :focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px
        }

        svg {
            flex: none
        }

        /* ========== বুট / স্পিনার ========== */
        .boot {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            background: var(--bg);
            z-index: 200
        }

        .spinner,
        .btn.loading::after {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(127, 127, 127, .3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: sp .7s linear infinite
        }

        .btn.loading::after {
            content: "";
            width: 16px;
            height: 16px;
            border-width: 2px;
            border-top-color: currentColor;
            margin-left: 8px
        }

        @keyframes sp {
            to {
                transform: rotate(360deg)
            }
        }

        /* ========== অথ স্ক্রিন ========== */
        #auth {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr;
            place-items: center;
            padding: calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom))
        }

        .authbox {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 26px 22px
        }

        .authtop {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .logo i {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--hero1), var(--hero2));
            display: grid;
            place-items: center;
            color: var(--accent);
            font-style: normal;
            font-weight: 800;
            font-size: 1.3rem
        }

        .logo b {
            font-size: 1.15rem;
            display: block;
            line-height: 1.1
        }

        .logo small {
            display: block
        }

        .authbox h2 {
            font-size: 1.45rem;
            margin: 6px 0 4px
        }

        .authbox p.sub {
            color: var(--muted);
            margin-bottom: 14px;
            font-size: .92rem
        }

        .gbtn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--solid);
            color: var(--text);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: .15s
        }

        .gbtn:hover {
            border-color: var(--primary)
        }

        .gbtn:disabled {
            opacity: .6
        }

        .or {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--muted);
            font-size: .8rem;
            margin: 14px 0
        }

        .or::before,
        .or::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border)
        }

        .msg {
            padding: 10px 12px;
            border-radius: 12px;
            font-size: .88rem;
            margin: 10px 0
        }

        .msg.err {
            background: rgba(217, 72, 59, .12);
            color: var(--expense)
        }

        .msg.ok {
            background: rgba(15, 157, 107, .13);
            color: var(--income)
        }

        .linkbtn {
            background: none;
            border: 0;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            padding: 4px;
            font-size: .9rem
        }

        .strength {
            display: flex;
            gap: 4px;
            margin-top: 6px
        }

        .strength i {
            flex: 1;
            height: 5px;
            border-radius: 4px;
            background: var(--border);
            transition: .2s
        }

        .strength small {
            margin-left: 6px;
            white-space: nowrap
        }

        /* ========== ফর্ম ========== */
        label {
            display: block;
            font-size: .85rem;
            font-weight: 600;
            margin: 10px 0 4px;
            color: var(--muted)
        }

        input,
        select,
        textarea {
            width: 100%;
            font: inherit;
            font-size: 16px;
            color: var(--text);
            background: var(--solid);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 11px 12px;
            transition: border-color .15s
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary)
        }

        input.bad,
        select.bad {
            border-color: var(--expense)
        }

        textarea {
            resize: vertical;
            min-height: 70px
        }

        .pw {
            position: relative
        }

        .pw input {
            padding-right: 46px
        }

        .pw button {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: 0;
            padding: 8px;
            color: var(--muted);
            cursor: pointer
        }

        .chk {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            margin: 12px 0;
            color: var(--text)
        }

        .chk input {
            width: 18px;
            height: 18px;
            accent-color: var(--primary)
        }

        .row2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        /* ========== বাটন ========== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 0;
            border-radius: 12px;
            padding: 11px 16px;
            font-weight: 600;
            font-size: .95rem;
            cursor: pointer;
            background: var(--solid);
            color: var(--text);
            border: 1.5px solid var(--border);
            transition: transform .1s, opacity .15s
        }

        .btn:active {
            transform: scale(.97)
        }

        .btn:disabled {
            opacity: .6;
            pointer-events: none
        }

        .btn.primary {
            background: linear-gradient(135deg, var(--hero1), var(--hero2));
            color: #fff;
            border-color: transparent
        }

        [data-theme=dark] .btn.primary {
            color: #04140f;
            background: linear-gradient(135deg, #3ec9a7, #2aa88a)
        }

        .btn.danger {
            background: var(--expense);
            color: #fff;
            border-color: transparent
        }

        .btn.block {
            width: 100%;
            margin-top: 14px
        }

        .btn.sm {
            padding: 7px 11px;
            font-size: .82rem;
            border-radius: 10px
        }

        .iconbtn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: 1.5px solid var(--border);
            background: var(--solid);
            color: var(--text);
            display: grid;
            place-items: center;
            cursor: pointer
        }

        .seg {
            display: flex;
            background: var(--border);
            border-radius: 12px;
            padding: 3px;
            gap: 3px
        }

        .seg button {
            flex: 1;
            border: 0;
            background: none;
            padding: 9px;
            border-radius: 10px;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
            font-size: .92rem
        }

        .seg button.on {
            background: var(--solid);
            color: var(--text);
            box-shadow: var(--shadow)
        }

        .seg button.on.inc {
            color: var(--income)
        }

        .seg button.on.exp {
            color: var(--expense)
        }

        /* ========== অ্যাপ লেআউট ========== */
        #app {
            display: flex;
            min-height: 100vh
        }

        .sidebar {
            display: none;
            width: 250px;
            flex: none;
            position: sticky;
            top: 0;
            height: 100vh;
            padding: 22px 14px;
            flex-direction: column;
            gap: 4px;
            background: var(--surface);
            backdrop-filter: blur(16px);
            border-right: 1px solid var(--border);
            overflow-y: auto
        }

        .sidebar .logo {
            padding: 0 8px 18px
        }

        .sidebar a.nv {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 12px;
            border-radius: 12px;
            color: var(--muted);
            font-weight: 600
        }

        .sidebar a.nv:hover {
            background: var(--border)
        }

        .sidebar a.nv.on {
            background: linear-gradient(135deg, var(--hero1), var(--hero2));
            color: #fff
        }

        [data-theme=dark] .sidebar a.nv.on {
            color: #04140f;
            background: linear-gradient(135deg, #3ec9a7, #2aa88a)
        }

        .sidebar .who {
            margin-top: auto;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: center
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--accent);
            color: #3a2a00;
            display: grid;
            place-items: center;
            font-weight: 800;
            flex: none;
            overflow: hidden
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .who div {
            overflow: hidden
        }

        .who b,
        .who small {
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .main {
            flex: 1;
            min-width: 0;
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 14px calc(100px + env(safe-area-inset-bottom))
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: calc(10px + env(safe-area-inset-top)) 0 10px;
            background: linear-gradient(var(--bg) 75%, transparent)
        }

        .topbar h1 {
            flex: 1;
            font-size: 1.35rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .bottomnav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 30;
            display: flex;
            padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
            background: var(--surface);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-top: 1px solid var(--border)
        }

        .bottomnav a {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: .68rem;
            font-weight: 600;
            color: var(--muted);
            padding: 6px 0;
            border-radius: 12px
        }

        .bottomnav a.on {
            color: var(--primary)
        }

        .fab {
            position: fixed;
            right: 16px;
            bottom: calc(82px + env(safe-area-inset-bottom));
            z-index: 31;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: 0;
            color: #3a2a00;
            background: var(--accent);
            box-shadow: 0 10px 24px rgba(242, 169, 0, .45);
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: transform .15s
        }

        .fab:active {
            transform: scale(.92)
        }

        @media(min-width:900px) {
            .sidebar {
                display: flex
            }

            .bottomnav {
                display: none
            }

            .main {
                padding: 0 30px 50px
            }

            .fab {
                bottom: 28px;
                right: 30px
            }

            .g4 {
                grid-template-columns: repeat(4, 1fr) !important
            }

            .cols {
                grid-template-columns: 1fr 1fr !important
            }
        }

        /* ========== কার্ড, গ্রিড ========== */
        .card {
            background: var(--surface);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 14px
        }

        .grid {
            display: grid;
            gap: 12px;
            margin-bottom: 14px
        }

        .g2 {
            grid-template-columns: 1fr 1fr
        }

        .g4 {
            grid-template-columns: 1fr 1fr
        }

        .cols {
            grid-template-columns: 1fr
        }

        .hero {
            border-radius: 22px;
            padding: 20px;
            color: #fff;
            background: linear-gradient(135deg, var(--hero1), var(--hero2));
            margin-bottom: 14px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow)
        }

        .hero::after {
            content: "৳";
            position: absolute;
            right: -8px;
            bottom: -40px;
            font-size: 9rem;
            font-weight: 800;
            opacity: .08;
            font-family: 'Bricolage Grotesque'
        }

        .hero small {
            color: rgba(255, 255, 255, .75)
        }

        .hero .big {
            font-size: 2.1rem;
            font-weight: 800;
            letter-spacing: -.5px;
            word-break: break-word
        }

        .hero .hs {
            display: flex;
            gap: 18px;
            margin-top: 12px;
            flex-wrap: wrap
        }

        .stat {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 13px;
            box-shadow: var(--shadow)
        }

        .stat .si {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            margin-bottom: 8px
        }

        .stat b {
            display: block;
            font-size: 1.08rem;
            word-break: break-word
        }

        .si.in {
            background: rgba(15, 157, 107, .14);
            color: var(--income)
        }

        .si.ex {
            background: rgba(217, 72, 59, .13);
            color: var(--expense)
        }

        .si.nt {
            background: rgba(242, 169, 0, .18);
            color: var(--warn)
        }

        .pos {
            color: var(--income)
        }

        .neg {
            color: var(--expense)
        }

        .head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px
        }

        .head h3 {
            margin: 0
        }

        .scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: .88rem
        }

        th,
        td {
            padding: 8px 6px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            white-space: nowrap
        }

        td.r,
        th.r {
            text-align: right
        }

        /* ========== লিস্ট রো ========== */
        .row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 4px;
            border-bottom: 1px solid var(--border);
            cursor: pointer
        }

        .row:last-child {
            border-bottom: 0
        }

        .ico {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            display: grid;
            place-items: center;
            font-size: 1.2rem;
            flex: none
        }

        .ico.in {
            background: rgba(15, 157, 107, .14)
        }

        .ico.ex {
            background: rgba(217, 72, 59, .12)
        }

        .ico.tr {
            background: rgba(242, 169, 0, .18);
            color: var(--warn)
        }

        .rb {
            flex: 1;
            overflow: hidden
        }

        .rb b,
        .rb small {
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .amt {
            font-weight: 700;
            white-space: nowrap
        }

        .empty {
            text-align: center;
            padding: 30px 12px;
            color: var(--muted)
        }

        .empty .e {
            font-size: 2.4rem;
            display: block;
            margin-bottom: 6px
        }

        .chip {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 99px;
            font-size: .74rem;
            font-weight: 600;
            background: var(--border);
            color: var(--muted)
        }

        .chip.warn {
            background: rgba(224, 138, 0, .16);
            color: var(--warn)
        }

        .chip.bad {
            background: rgba(217, 72, 59, .14);
            color: var(--expense)
        }

        .chip.good {
            background: rgba(15, 157, 107, .14);
            color: var(--income)
        }

        .bar {
            height: 9px;
            border-radius: 9px;
            background: var(--border);
            overflow: hidden;
            margin: 8px 0 4px
        }

        .bar i {
            display: block;
            height: 100%;
            border-radius: 9px;
            background: var(--income);
            transition: width .5s
        }

        .bar i.warn {
            background: var(--warn)
        }

        .bar i.bad {
            background: var(--expense)
        }

        .ins {
            display: flex;
            gap: 10px;
            padding: 9px 0;
            border-bottom: 1px dashed var(--border);
            font-size: .92rem
        }

        .ins:last-child {
            border: 0
        }

        .ins i {
            font-style: normal
        }

        /* ========== চার্ট ========== */
        .chart {
            width: 100%;
            height: auto;
            display: block
        }

        .chart .gl {
            stroke: var(--border);
            stroke-width: 1
        }

        .chart .ax {
            fill: var(--muted);
            font-size: 9px
        }

        .chart .dt {
            fill: var(--text);
            font-size: 5px;
            font-weight: 700
        }

        .donut {
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap
        }

        .donut svg {
            width: 150px;
            height: 150px;
            flex: none
        }

        .legend {
            list-style: none;
            flex: 1;
            min-width: 150px;
            font-size: .85rem
        }

        .legend li {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 0
        }

        .legend i {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            flex: none
        }

        .legend span {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .hb {
            margin: 10px 0
        }

        .hb .hl {
            display: flex;
            justify-content: space-between;
            font-size: .88rem;
            margin-bottom: 3px;
            gap: 8px
        }

        .legend2 {
            display: flex;
            gap: 14px;
            font-size: .78rem;
            color: var(--muted);
            margin-bottom: 4px
        }

        .legend2 i {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 3px;
            margin-right: 5px
        }

        /* ========== ক্যালেন্ডার ========== */
        .cal {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center
        }

        .cal .wd {
            font-size: .72rem;
            color: var(--muted);
            padding: 4px 0;
            font-weight: 600
        }

        .cal button {
            aspect-ratio: 1;
            border: 1.5px solid transparent;
            border-radius: 12px;
            background: none;
            color: var(--text);
            cursor: pointer;
            font-size: .9rem;
            position: relative;
            font-family: inherit
        }

        .cal button:hover {
            background: var(--border)
        }

        .cal button.td {
            border-color: var(--accent)
        }

        .cal button.sel {
            background: var(--primary);
            color: #fff
        }

        [data-theme=dark] .cal button.sel {
            color: #04140f
        }

        .cal button.has::after {
            content: "";
            position: absolute;
            bottom: 5px;
            left: 50%;
            width: 6px;
            height: 6px;
            margin-left: -3px;
            border-radius: 50%;
            background: var(--accent)
        }

        .cal button.sel.has::after {
            background: #fff
        }

        /* ========== মডাল ========== */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(4, 12, 10, .55);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            transition: opacity .2s
        }

        .overlay.show {
            opacity: 1
        }

        .sheet {
            width: 100%;
            max-width: 560px;
            max-height: 92vh;
            overflow-y: auto;
            background: var(--solid);
            border-radius: 24px 24px 0 0;
            padding: 18px 18px calc(20px + env(safe-area-inset-bottom));
            transform: translateY(40px);
            transition: transform .25s;
            -webkit-overflow-scrolling: touch
        }

        .overlay.show .sheet {
            transform: none
        }

        .sheet h2 {
            font-size: 1.25rem;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px
        }

        @media(min-width:700px) {
            .overlay {
                align-items: center
            }

            .sheet {
                border-radius: 24px;
                max-height: 88vh
            }
        }

        .acts {
            display: flex;
            gap: 10px;
            margin-top: 16px
        }

        .acts .btn {
            flex: 1
        }

        .preview {
            margin-top: 8px;
            display: flex;
            gap: 10px;
            align-items: center
        }

        .preview img {
            width: 72px;
            height: 72px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid var(--border)
        }

        .icons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px
        }

        .icons button {
            width: 42px;
            height: 42px;
            font-size: 1.3rem;
            border-radius: 12px;
            border: 1.5px solid var(--border);
            background: var(--solid);
            cursor: pointer
        }

        .icons button.on {
            border-color: var(--primary);
            background: rgba(19, 128, 111, .14)
        }

        .recimg {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 14px;
            display: block;
            margin: 10px auto
        }

        /* ========== টোস্ট ও স্কেলিটন ========== */
        #toasts {
            position: fixed;
            top: calc(12px + env(safe-area-inset-top));
            left: 0;
            right: 0;
            z-index: 300;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            padding: 0 12px
        }

        .toast {
            pointer-events: auto;
            max-width: 420px;
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            background: var(--text);
            color: var(--bg);
            font-weight: 500;
            font-size: .92rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
            animation: tin .25s
        }

        .toast.success {
            background: var(--income);
            color: #fff
        }

        .toast.error {
            background: var(--expense);
            color: #fff
        }

        .toast.warn {
            background: var(--warn);
            color: #2a1c00
        }

        @keyframes tin {
            from {
                transform: translateY(-14px);
                opacity: 0
            }
        }

        .skel {
            border-radius: 16px;
            background: linear-gradient(90deg, var(--border) 25%, rgba(127, 127, 127, .12) 50%, var(--border) 75%);
            background-size: 200% 100%;
            animation: sk 1.2s infinite
        }

        @keyframes sk {
            to {
                background-position: -200% 0
            }
        }

        .tabs {
            margin-bottom: 14px
        }

        .fl label:first-child {
            margin-top: 0
        }

        .prof {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 8px
        }

        .more a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            border-bottom: 1px solid var(--border);
            font-weight: 600
        }

        .more a:last-child {
            border: 0
        }

        .wcard b.bal {
            font-size: 1.4rem;
            display: block
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition: none !important
            }
        }

        @media print {

            .sidebar,
            .bottomnav,
            .fab,
            .topbar,
            .noprint,
            #toasts {
                display: none !important
            }

            body {
                background: #fff;
                color: #000
            }

            body::before {
                display: none
            }

            .main {
                padding: 0;
                max-width: none
            }

            .card,
            .stat {
                box-shadow: none;
                background: #fff;
                border-color: #ccc;
                break-inside: avoid
            }
        }

        /* =====================================================================
   v2 · প্রিমিয়াম ডিজাইন লেয়ার (মোশন, ড্রয়ার, নতুন সেকশন)
   ===================================================================== */
        :root {
            --ease: cubic-bezier(.22, 1, .36, 1);
            --ease2: cubic-bezier(.65, 0, .35, 1);
            --solid2: #f6faf8;
            --glow: 0 1px 0 rgba(255, 255, 255, .7) inset, 0 12px 36px -14px rgba(14, 59, 54, .18);
            --heat1: rgba(242, 169, 0, .3);
            --heat2: rgba(240, 140, 0, .55);
            --heat3: rgba(226, 92, 50, .76);
            --heat4: #c93a2e
        }

        [data-theme=dark] {
            --bg: #060e0c;
            --surface: rgba(17, 31, 27, .8);
            --solid: #0f1d19;
            --solid2: #152622;
            --border: #1f352e;
            --glow: 0 1px 0 rgba(255, 255, 255, .05) inset, 0 16px 44px -14px rgba(0, 0, 0, .7);
            --heat1: rgba(245, 184, 58, .28);
            --heat2: rgba(245, 160, 50, .52);
            --heat3: rgba(240, 110, 70, .74);
            --heat4: #ff6b5c
        }

        html,
        body {
            overscroll-behavior-y: contain
        }

        html.tt *,
        html.tt *::before,
        html.tt *::after {
            transition: background-color .45s var(--ease2), color .45s var(--ease2), border-color .45s var(--ease2), fill .45s, stroke .45s !important
        }

        body {
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum"
        }

        .card {
            box-shadow: var(--glow)
        }

        .sheet {
            max-height: 92vh;
            max-height: 92dvh
        }

        @supports(backdrop-filter:blur(2px)) {
            .overlay {
                backdrop-filter: blur(7px);
                -webkit-backdrop-filter: blur(7px)
            }
        }

        input:focus,
        select:focus,
        textarea:focus {
            box-shadow: 0 0 0 4px rgba(19, 128, 111, .16)
        }

        [data-theme=dark] input:focus,
        [data-theme=dark] select:focus,
        [data-theme=dark] textarea:focus {
            box-shadow: 0 0 0 4px rgba(62, 201, 167, .16)
        }

        .btn,
        .iconbtn,
        .gbtn,
        .qa,
        .wcb {
            position: relative;
            overflow: hidden;
            transition: transform .25s var(--ease), box-shadow .25s var(--ease), background-color .2s, border-color .2s, opacity .2s
        }

        .btn:hover:not(:disabled),
        .iconbtn:hover {
            border-color: var(--primary)
        }

        .rip {
            position: absolute;
            border-radius: 50%;
            background: currentColor;
            opacity: .2;
            transform: scale(0);
            animation: rip .65s var(--ease) forwards;
            pointer-events: none
        }

        @keyframes rip {
            to {
                transform: scale(1);
                opacity: 0
            }
        }

        /* --- entrance (fade + slide) --- */
        .rv {
            opacity: 0
        }

        .rv.in {
            opacity: 1;
            animation: rise .7s var(--ease) backwards;
            animation-delay: var(--d, 0ms)
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(18px)
            }
        }

        @keyframes fade {
            from {
                opacity: 0
            }
        }

        @keyframes grow {
            from {
                transform: scaleY(0)
            }
        }

        @keyframes draw {
            from {
                stroke-dashoffset: 1
            }

            to {
                stroke-dashoffset: 0
            }
        }

        @keyframes ringin {
            from {
                stroke-dasharray: 0 100
            }
        }

        @keyframes barin {
            from {
                width: 0
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-5px)
            }
        }

        @keyframes pop {
            from {
                transform: scale(.92)
            }
        }

        .chart rect {
            transform-box: fill-box;
            transform-origin: bottom;
            animation: grow .8s var(--ease) backwards
        }

        .chart polyline,
        .flow path.dr {
            stroke-dasharray: 1;
            stroke-dashoffset: 0;
            animation: draw 1.3s var(--ease) backwards
        }

        .spark {
            animation: wipe 1.3s var(--ease) backwards
        }

        @keyframes wipe {
            from {
                clip-path: inset(0 100% 0 0)
            }
        }

        .chart path {
            animation: fade 1.2s var(--ease) backwards
        }

        .dsvg circle {
            animation: ringin 1s var(--ease) backwards
        }

        .bar i {
            animation: barin 1s var(--ease) backwards
        }

        .seg button.on,
        .pchip.on {
            animation: pop .3s var(--ease)
        }

        /* --- topbar --- */
        .topbar {
            transition: box-shadow .3s
        }

        .topbar.sc {
            box-shadow: 0 10px 24px -18px rgba(0, 0, 0, .5)
        }

        .srch {
            display: none;
            align-items: center;
            gap: 10px;
            min-width: 260px;
            height: 40px;
            padding: 0 12px;
            border-radius: 12px;
            border: 1.5px solid var(--border);
            background: var(--solid);
            color: var(--muted);
            cursor: pointer;
            font: inherit;
            font-size: .9rem
        }

        .srch:hover {
            border-color: var(--primary)
        }

        .srch span {
            flex: 1;
            text-align: left
        }

        kbd {
            font: 600 .7rem/1 'Bricolage Grotesque', sans-serif;
            padding: 4px 6px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--solid2);
            color: var(--muted)
        }

        @media(min-width:700px) {
            .srch {
                display: inline-flex
            }

            #searchBtn {
                display: none
            }
        }

        /* --- nav indicators --- */
        .bottomnav a {
            position: relative
        }

        .bottomnav a::before {
            content: "";
            position: absolute;
            top: -6px;
            left: 50%;
            width: 24px;
            height: 3px;
            border-radius: 0 0 4px 4px;
            background: var(--primary);
            transform: translateX(-50%) scaleX(0);
            transition: transform .4s var(--ease)
        }

        .bottomnav a.on::before {
            transform: translateX(-50%) scaleX(1)
        }

        .bottomnav a svg {
            transition: transform .35s var(--ease)
        }

        .bottomnav a.on svg {
            transform: translateY(-2px)
        }

        .sidebar a.nv {
            position: relative;
            transition: background-color .25s, color .25s, padding .3s var(--ease)
        }

        .sidebar a.nv:hover {
            padding-left: 16px
        }

        .fab svg {
            transition: transform .45s var(--ease)
        }

        .fab:hover svg,
        .fab:active svg {
            transform: rotate(90deg)
        }

        .fab {
            animation: float 5s ease-in-out infinite
        }

        /* --- hero --- */
        .hero2 {
            position: relative;
            overflow: hidden;
            isolation: isolate;
            border-radius: 26px;
            padding: 20px 20px 0;
            color: #fff;
            margin-bottom: 14px;
            background: radial-gradient(120% 90% at 100% 0%, rgba(242, 169, 0, .3), transparent 55%), linear-gradient(140deg, var(--hero1), var(--hero2));
            box-shadow: 0 22px 50px -22px rgba(14, 59, 54, .7)
        }

        .hero2::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            background: radial-gradient(420px 220px at 0% 100%, rgba(255, 255, 255, .14), transparent)
        }

        .hero2 small {
            color: rgba(255, 255, 255, .74)
        }

        .hero2 h2 {
            font-size: 1.05rem;
            font-weight: 600;
            margin: 0
        }

        .hgreet {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: flex-start;
            flex-wrap: wrap
        }

        .hero2 .big {
            font-size: clamp(2.3rem, 10vw, 3.3rem);
            font-weight: 800;
            letter-spacing: -.025em;
            line-height: 1.05;
            margin: 4px 0 10px;
            word-break: break-word
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 11px;
            border-radius: 99px;
            background: rgba(255, 255, 255, .15);
            font-size: .8rem;
            font-weight: 600;
            color: #fff
        }

        .hstats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 16px 0 10px
        }

        .hstats>div {
            background: rgba(255, 255, 255, .1);
            border-radius: 14px;
            padding: 9px 10px;
            backdrop-filter: blur(6px)
        }

        .hstats b {
            display: block;
            font-size: .95rem;
            word-break: break-word
        }

        .spark {
            display: block;
            width: calc(100% + 40px);
            margin: 0 -20px;
            height: 72px
        }

        .spark.sm {
            width: 100%;
            margin: 0;
            height: 44px
        }

        /* --- quick actions --- */
        .qa-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 14px
        }

        @media(min-width:700px) {
            .qa-grid {
                grid-template-columns: repeat(6, 1fr)
            }
        }

        .qa {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 14px 6px;
            min-height: 92px;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-weight: 600;
            font-size: .8rem;
            line-height: 1.2;
            font-family: inherit;
            cursor: pointer;
            text-align: center
        }

        .qa i {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            transition: transform .4s var(--ease)
        }

        .qa:hover {
            transform: translateY(-3px);
            box-shadow: var(--glow)
        }

        .qa:hover i {
            transform: scale(1.1) rotate(-5deg)
        }

        .qa:active {
            transform: scale(.96)
        }

        .qa.a i {
            background: rgba(15, 157, 107, .16);
            color: var(--income)
        }

        .qa.b i {
            background: rgba(217, 72, 59, .14);
            color: var(--expense)
        }

        .qa.c i {
            background: rgba(242, 169, 0, .2);
            color: var(--warn)
        }

        .qa.d i {
            background: rgba(59, 130, 196, .16);
            color: #3b82c4
        }

        .qa.e i {
            background: rgba(19, 128, 111, .16);
            color: var(--primary)
        }

        .qa.f i {
            background: rgba(139, 92, 246, .16);
            color: #8b5cf6
        }

        /* --- rows / timeline --- */
        .row {
            border-radius: 14px;
            padding: 11px 8px;
            transition: background-color .25s, transform .35s var(--ease)
        }

        .row:hover {
            background: color-mix(in srgb, var(--primary) 7%, transparent);
            transform: translateX(3px)
        }

        .row .rb small+small {
            margin-top: 1px
        }

        .amt {
            text-align: right
        }

        .rcp {
            display: block;
            color: var(--muted);
            margin-top: 2px;
            line-height: 0
        }

        .ico.sm {
            width: 34px;
            height: 34px;
            border-radius: 11px;
            font-size: 1rem
        }

        .tl {
            position: relative
        }

        .tgrp {
            position: relative
        }

        .tgrp::before {
            content: "";
            position: absolute;
            left: 19px;
            top: 44px;
            bottom: 16px;
            width: 2px;
            background: var(--border);
            border-radius: 2px
        }

        .tgrp .day {
            font-size: .74rem;
            font-weight: 700;
            color: var(--muted);
            padding: 12px 0 4px 52px
        }

        .tli {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 7px 4px;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            transition: background-color .25s
        }

        .tli:hover {
            background: color-mix(in srgb, var(--primary) 7%, transparent)
        }

        .tli .ico {
            position: relative;
            z-index: 1;
            width: 32px;
            height: 32px;
            margin: 0 4px;
            border-radius: 50%;
            font-size: .95rem;
            box-shadow: 0 0 0 4px var(--bg)
        }

        /* --- health --- */
        .hc {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        .hi {
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px;
            background: var(--solid2);
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            cursor: help;
            min-height: 112px
        }

        .hi>small {
            font-weight: 600
        }

        .hr {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .hr b {
            display: block;
            font-size: .98rem;
            word-break: break-word
        }

        .hr small {
            display: block;
            line-height: 1.25
        }

        .ring {
            width: 54px;
            height: 54px;
            flex: none
        }

        .ring .rg {
            animation: ringin 1.2s var(--ease) backwards
        }

        .ring .rt {
            font-size: 8px;
            font-weight: 700;
            fill: var(--text)
        }

        .mb {
            height: 7px;
            border-radius: 7px;
            background: var(--border);
            overflow: hidden;
            margin-top: 4px
        }

        .mb i {
            display: block;
            height: 100%;
            border-radius: 7px;
            animation: barin 1s var(--ease) backwards
        }

        [data-tip]::after {
            content: attr(data-tip);
            position: absolute;
            left: 0;
            bottom: calc(100% + 8px);
            width: max-content;
            max-width: min(230px, 70vw);
            background: var(--text);
            color: var(--bg);
            padding: 8px 11px;
            border-radius: 11px;
            font-size: .76rem;
            font-weight: 500;
            line-height: 1.4;
            opacity: 0;
            transform: translateY(4px);
            pointer-events: none;
            transition: opacity .2s, transform .3s var(--ease);
            z-index: 8;
            text-align: left;
            white-space: normal
        }

        .hi:nth-child(even)::after {
            left: auto;
            right: 0
        }

        [data-tip]:hover::after,
        [data-tip]:focus-visible::after {
            opacity: 1;
            transform: none
        }

        /* --- where money / lists --- */
        .wrow {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 8px 6px;
            border: 0;
            background: none;
            color: inherit;
            font: inherit;
            text-align: left;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color .2s
        }

        .wrow:hover {
            background: color-mix(in srgb, var(--primary) 7%, transparent)
        }

        .wrow .rb b {
            font-size: .92rem
        }

        .dotc {
            width: 9px;
            height: 9px;
            border-radius: 3px;
            flex: none
        }

        .wsplit {
            display: grid;
            gap: 12px;
            grid-template-columns: 1fr;
            align-items: center
        }

        .wsplit .dsvg {
            width: 150px;
            height: 150px;
            margin: 0 auto;
            display: block
        }

        @media(min-width:520px) {
            .wsplit {
                grid-template-columns: 160px 1fr
            }
        }

        .dsvg circle[data-act] {
            transition: stroke-width .25s
        }

        .dsvg circle[data-act]:hover {
            stroke-width: 7
        }

        .flow {
            width: 100%;
            height: auto;
            display: block
        }

        .flow .fl {
            font-size: 8.5px;
            fill: var(--text);
            font-weight: 600
        }

        .flow .fl2 {
            font-size: 7.5px;
            fill: var(--muted)
        }

        .flow .fh {
            font-size: 7.5px;
            fill: var(--muted);
            font-weight: 700
        }

        .flow .fm {
            font-size: 8.5px;
            font-weight: 700;
            fill: var(--text);
            paint-order: stroke;
            stroke: var(--solid);
            stroke-width: 3px;
            stroke-linejoin: round
        }

        /* --- chips / period --- */
        .chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 4px;
            margin-bottom: 10px
        }

        .chips::-webkit-scrollbar {
            display: none
        }

        .pchip {
            flex: none;
            padding: 8px 14px;
            border-radius: 99px;
            border: 1.5px solid var(--border);
            background: var(--solid);
            color: var(--muted);
            font-weight: 600;
            font-size: .84rem;
            font-family: inherit;
            cursor: pointer;
            transition: background-color .25s, color .25s, border-color .25s, transform .2s var(--ease)
        }

        .pchip:active {
            transform: scale(.95)
        }

        .pchip.on {
            background: var(--primary);
            color: #fff;
            border-color: transparent
        }

        [data-theme=dark] .pchip.on {
            color: #04140f
        }

        /* --- heatmap --- */
        .heat {
            display: grid;
            grid-auto-flow: column;
            grid-template-rows: repeat(7, 16px);
            gap: 3px;
            width: max-content;
            animation: fade .7s var(--ease)
        }

        .heat i {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            background: var(--border);
            opacity: .6;
            cursor: pointer;
            transition: transform .2s var(--ease)
        }

        .heat i:hover {
            transform: scale(1.25)
        }

        .heat i.l1 {
            background: var(--heat1);
            opacity: 1
        }

        .heat i.l2 {
            background: var(--heat2);
            opacity: 1
        }

        .heat i.l3 {
            background: var(--heat3);
            opacity: 1
        }

        .heat i.l4 {
            background: var(--heat4);
            opacity: 1
        }

        .heat i.f {
            opacity: .22
        }

        .heat i.x {
            visibility: hidden
        }

        .heat i.sel {
            outline: 2px solid var(--text);
            outline-offset: 1px
        }

        .hleg {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: .75rem;
            color: var(--muted);
            margin-top: 10px;
            flex-wrap: wrap
        }

        .hleg i {
            width: 13px;
            height: 13px;
            border-radius: 4px;
            background: var(--border);
            display: inline-block
        }

        .hleg i.l1 {
            background: var(--heat1)
        }

        .hleg i.l2 {
            background: var(--heat2)
        }

        .hleg i.l3 {
            background: var(--heat3)
        }

        .hleg i.l4 {
            background: var(--heat4)
        }

        /* --- story --- */
        .story {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            margin: 0 -14px 14px;
            padding: 0 14px 6px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch
        }

        .story::-webkit-scrollbar {
            display: none
        }

        .chap {
            flex: 0 0 82%;
            scroll-snap-align: center;
            border-radius: 22px;
            padding: 18px;
            color: #fff;
            min-height: 200px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 18px 40px -22px rgba(0, 0, 0, .6)
        }

        .chap::after {
            content: "";
            position: absolute;
            right: -40px;
            top: -40px;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .1)
        }

        .chap small {
            color: rgba(255, 255, 255, .78)
        }

        .chap .big {
            font-size: 1.7rem;
            font-weight: 800;
            line-height: 1.1;
            word-break: break-word
        }

        .chap.c1 {
            background: linear-gradient(140deg, #0e3b36, #13806f)
        }

        .chap.c2 {
            background: linear-gradient(140deg, #6b3f00, #d18a00)
        }

        .chap.c3 {
            background: linear-gradient(140deg, #123f5c, #2a86a8)
        }

        .chap.c4 {
            background: linear-gradient(140deg, #3c2a66, #7458c2)
        }

        .chap .cl {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-size: .86rem;
            padding: 3px 0
        }

        @media(min-width:900px) {
            .story {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                margin: 0 0 14px;
                padding: 0
            }

            .chap {
                flex: none
            }
        }

        /* --- simulator --- */
        input[type=range] {
            padding: 0;
            border: 0;
            background: none;
            height: 34px;
            accent-color: var(--primary);
            box-shadow: none !important
        }

        .sl {
            display: grid;
            grid-template-columns: 1fr 110px;
            gap: 12px;
            align-items: center
        }

        .simt td,
        .simt th {
            padding: 9px 6px
        }

        .simt td:first-child {
            font-weight: 600
        }

        .note {
            color: var(--muted);
            font-size: .84rem;
            margin-bottom: 6px
        }

        /* --- calendar --- */
        .cal button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transition: background-color .25s, transform .25s var(--ease)
        }

        .cal button.has::after {
            display: none
        }

        .cal button .dn {
            font-weight: 600;
            line-height: 1
        }

        .cal button .am {
            display: none;
            font-size: .6rem;
            color: var(--muted);
            line-height: 1
        }

        .cal button .dots {
            display: flex;
            gap: 3px;
            height: 6px
        }

        .dots b {
            width: 6px;
            height: 6px;
            border-radius: 50%
        }

        .dots .di {
            background: var(--income)
        }

        .dots .de {
            background: var(--expense)
        }

        .cal button.h1 {
            background: var(--heat1)
        }

        .cal button.h2 {
            background: var(--heat2)
        }

        .cal button.h3 {
            background: var(--heat3);
            color: #fff
        }

        .cal button.h4 {
            background: var(--heat4);
            color: #fff
        }

        .cal button.h3 .am,
        .cal button.h4 .am {
            color: rgba(255, 255, 255, .85)
        }

        .cal button:active {
            transform: scale(.92)
        }

        @media(min-width:700px) {
            .cal button .am {
                display: block
            }

            .cal {
                gap: 6px
            }
        }

        /* --- wallets --- */
        .wc {
            position: relative;
            overflow: hidden;
            isolation: isolate;
            border-radius: 22px;
            padding: 18px;
            color: #fff;
            background: linear-gradient(140deg, var(--c1), var(--c2));
            box-shadow: 0 18px 34px -18px var(--c1);
            min-height: 182px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: transform .45s var(--ease), box-shadow .45s var(--ease)
        }

        .wc:hover {
            transform: translateY(-4px)
        }

        .wc::before {
            content: "";
            position: absolute;
            z-index: -1;
            right: -50px;
            top: -50px;
            width: 190px;
            height: 190px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .12)
        }

        .wc::after {
            content: "";
            position: absolute;
            z-index: -1;
            left: -30px;
            bottom: -70px;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: rgba(0, 0, 0, .14)
        }

        .wc small {
            color: rgba(255, 255, 255, .78)
        }

        .wct {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px
        }

        .wk {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            font-weight: 700;
            font-size: .85rem;
            background: rgba(255, 255, 255, .16);
            padding: 4px 10px;
            border-radius: 99px
        }

        .wbal {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -.02em;
            font-family: 'Bricolage Grotesque', sans-serif;
            word-break: break-word
        }

        .wcm {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
            font-size: .76rem;
            color: rgba(255, 255, 255, .8)
        }

        .wca {
            display: flex;
            gap: 8px;
            margin-top: auto;
            padding-top: 10px
        }

        .wcb {
            border: 0;
            background: rgba(255, 255, 255, .18);
            color: #fff;
            border-radius: 12px;
            padding: 8px 12px;
            font-weight: 600;
            font-size: .8rem;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(6px)
        }

        .wcb:hover {
            background: rgba(255, 255, 255, .28)
        }

        .wcb.ic {
            padding: 8px
        }

        /* --- budgets / recurring --- */
        .bc .head {
            margin-bottom: 6px
        }

        .bc .meta {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-size: .82rem;
            color: var(--muted);
            flex-wrap: wrap
        }

        .st {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: .76rem;
            font-weight: 600
        }

        .st::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--income)
        }

        .st.warn::before {
            background: var(--warn);
            box-shadow: 0 0 0 4px rgba(224, 138, 0, .18)
        }

        .st.bad::before {
            background: var(--expense);
            box-shadow: 0 0 0 4px rgba(217, 72, 59, .15)
        }

        .rtl {
            position: relative;
            padding-left: 24px
        }

        .rtl::before {
            content: "";
            position: absolute;
            left: 7px;
            top: 8px;
            bottom: 8px;
            width: 2px;
            background: var(--border);
            border-radius: 2px
        }

        .ri {
            position: relative
        }

        .ri .rd {
            position: absolute;
            left: -23px;
            top: 20px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--border);
            box-shadow: 0 0 0 4px var(--bg)
        }

        .ri .rd.on {
            background: var(--primary)
        }

        .chip.mut {
            background: var(--solid2);
            border: 1px solid var(--border)
        }

        /* --- empty --- */
        .empty {
            padding: 34px 14px
        }

        .empty .eic {
            width: 78px;
            height: 78px;
            border-radius: 26px;
            margin: 0 auto 14px;
            display: grid;
            place-items: center;
            font-size: 2rem;
            color: var(--primary);
            background: linear-gradient(135deg, rgba(19, 128, 111, .16), rgba(242, 169, 0, .2));
            animation: float 4.5s ease-in-out infinite
        }

        .empty b {
            display: block;
            color: var(--text);
            font-size: 1.02rem
        }

        .empty p {
            max-width: 290px;
            margin: 4px auto 0;
            font-size: .9rem
        }

        /* --- receipt UX --- */
        .drop {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 18px;
            border: 2px dashed var(--border);
            border-radius: 16px;
            color: var(--muted);
            cursor: pointer;
            text-align: center;
            margin: 0;
            transition: border-color .25s, background-color .25s
        }

        .drop:hover,
        .drop.pulse {
            border-color: var(--primary);
            background: rgba(19, 128, 111, .06)
        }

        .drop b {
            color: var(--text)
        }

        .drop.pulse {
            animation: pop .5s var(--ease) 2
        }

        .rprev {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--solid2)
        }

        .rprev img {
            width: 76px;
            height: 76px;
            object-fit: cover;
            border-radius: 12px;
            flex: none
        }

        .rprev .ra {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-start
        }

        .prog {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: .82rem
        }

        .prog .pb {
            flex: 1;
            height: 8px;
            border-radius: 8px;
            background: var(--border);
            overflow: hidden
        }

        .prog .pb i {
            display: block;
            height: 100%;
            width: 0;
            background: var(--primary);
            border-radius: 8px;
            transition: width .25s
        }

        .prog[data-st=ok] .pb i {
            background: var(--income)
        }

        .prog[data-st=err] .pb i {
            background: var(--expense)
        }

        .prog[data-st=err] span {
            color: var(--expense)
        }

        .prog[data-st=ok] span {
            color: var(--income)
        }

        .rimg {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            margin: 6px 0 10px;
            cursor: zoom-in;
            border: 1px solid var(--border)
        }

        .rimg img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            display: block;
            transition: transform .6s var(--ease)
        }

        .rimg:hover img {
            transform: scale(1.04)
        }

        .rimg span {
            position: absolute;
            right: 10px;
            bottom: 10px;
            display: inline-flex;
            gap: 6px;
            align-items: center;
            background: rgba(0, 0, 0, .6);
            color: #fff;
            padding: 6px 10px;
            border-radius: 99px;
            font-size: .78rem;
            font-weight: 600;
            backdrop-filter: blur(6px)
        }

        /* --- sheets / drawer / viewer / palette --- */
        .grab {
            width: 44px;
            height: 5px;
            border-radius: 5px;
            background: var(--border);
            margin: -6px auto 14px
        }

        @media(min-width:700px) {
            .grab {
                display: none
            }

            .overlay.drawer {
                align-items: stretch;
                justify-content: flex-end
            }

            .overlay.drawer .sheet {
                max-width: 450px;
                height: 100%;
                max-height: 100%;
                border-radius: 26px 0 0 26px;
                transform: translateX(70px)
            }

            .overlay.drawer.show .sheet {
                transform: none
            }
        }

        .sheet {
            transition: transform .45s var(--ease)
        }

        .sheet .acts {
            position: sticky;
            bottom: -20px;
            padding: 14px 0 2px;
            background: linear-gradient(transparent, var(--solid) 32%);
            z-index: 2
        }

        .dhero {
            text-align: center;
            padding: 4px 0 12px
        }

        .dhero .big {
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -.02em;
            font-family: 'Bricolage Grotesque', sans-serif;
            line-height: 1.1;
            margin: 2px 0 8px;
            word-break: break-word
        }

        .kvs {
            margin-top: 6px
        }

        .kv {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            padding: 11px 0;
            border-bottom: 1px solid var(--border);
            font-size: .92rem
        }

        .kv span {
            color: var(--muted)
        }

        .kv b {
            text-align: right;
            word-break: break-word;
            font-weight: 600
        }

        .overlay.viewer {
            background: rgba(2, 8, 7, .94)
        }

        .overlay.viewer .sheet {
            background: none;
            padding: calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));
            max-width: 100vw;
            width: 100%;
            height: 100%;
            max-height: 100%;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transform: scale(.96);
            opacity: 0;
            transition: transform .45s var(--ease), opacity .3s
        }

        .overlay.viewer.show .sheet {
            transform: none;
            opacity: 1
        }

        .overlay.viewer .grab {
            display: none
        }

        .vwtop {
            align-self: flex-end
        }

        .vwtop .iconbtn {
            background: rgba(255, 255, 255, .14);
            color: #fff;
            border-color: transparent
        }

        .vwbox {
            overflow: auto;
            max-width: 100%;
            max-height: 78vh;
            max-height: 78dvh;
            border-radius: 14px
        }

        .vwbox img {
            display: block;
            max-width: 100%;
            max-height: 78vh;
            max-height: 78dvh;
            object-fit: contain;
            cursor: zoom-in;
            margin: auto
        }

        .vwbox img.z {
            max-width: none;
            max-height: none;
            width: 200%;
            cursor: zoom-out
        }

        .vwbar {
            display: flex;
            gap: 10px
        }

        .vwbar .btn {
            background: rgba(255, 255, 255, .14);
            color: #fff;
            border-color: transparent
        }

        .overlay.cmd {
            align-items: flex-start;
            padding-top: env(safe-area-inset-top)
        }

        .overlay.cmd .sheet {
            padding: 0;
            max-width: 640px;
            border-radius: 0 0 24px 24px;
            transform: translateY(-24px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 88vh;
            max-height: 88dvh
        }

        .overlay.cmd.show .sheet {
            transform: none
        }

        .overlay.cmd .grab {
            display: none
        }

        @media(min-width:700px) {
            .overlay.cmd {
                padding-top: 10vh
            }

            .overlay.cmd .sheet {
                border-radius: 22px;
                max-height: 72vh
            }
        }

        .cmdin {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            color: var(--muted)
        }

        .cmdin input {
            border: 0;
            padding: 4px 0;
            background: none;
            box-shadow: none !important;
            flex: 1;
            color: var(--text)
        }

        .cmdlist {
            overflow-y: auto;
            padding: 8px 8px 12px;
            flex: 1;
            -webkit-overflow-scrolling: touch
        }

        .cmg {
            font-size: .72rem;
            font-weight: 700;
            color: var(--muted);
            padding: 10px 10px 4px
        }

        .cmi {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 9px 10px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            border: 0;
            background: none;
            color: inherit;
            text-align: left;
            font: inherit;
            transition: background-color .15s
        }

        .cmi:hover,
        .cmi.act {
            background: color-mix(in srgb, var(--primary) 10%, transparent)
        }

        .cmi .ico {
            width: 36px;
            height: 36px;
            border-radius: 11px;
            font-size: 1rem
        }

        .cmi b {
            display: block;
            font-size: .92rem
        }

        .cmi small {
            display: block
        }

        .cmi .rb {
            flex: 1
        }

        /* --- toast --- */
        .toast {
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            animation: tin .5s var(--ease);
            border: 1px solid rgba(255, 255, 255, .08)
        }

        .toast.out {
            animation: tout .35s var(--ease) forwards
        }

        .toast .ti {
            width: 26px;
            height: 26px;
            border-radius: 9px;
            background: rgba(255, 255, 255, .2);
            display: grid;
            place-items: center;
            flex: none
        }

        .toast .tm {
            flex: 1
        }

        .toast .tb {
            position: absolute;
            left: 0;
            bottom: 0;
            height: 3px;
            width: 100%;
            background: rgba(255, 255, 255, .55);
            transform-origin: left;
            animation: tbar 3.8s linear forwards
        }

        @keyframes tin {
            from {
                transform: translateY(-18px) scale(.96);
                opacity: 0
            }
        }

        @keyframes tout {
            to {
                transform: translateY(-14px) scale(.97);
                opacity: 0
            }
        }

        @keyframes tbar {
            to {
                transform: scaleX(0)
            }
        }

        /* --- pull to refresh --- */
        #ptr {
            position: fixed;
            top: calc(6px + env(safe-area-inset-top));
            left: 50%;
            z-index: 60;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--solid);
            box-shadow: var(--glow);
            border: 1px solid var(--border);
            display: grid;
            place-items: center;
            transform: translate(-50%, -70px);
            opacity: 0;
            pointer-events: none;
            transition: transform .35s var(--ease), opacity .3s
        }

        #ptr::after {
            content: "";
            width: 18px;
            height: 18px;
            border: 2.5px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%
        }

        #ptr.spin::after {
            animation: sp .7s linear infinite
        }

        /* --- skeleton --- */
        .skel {
            position: relative;
            overflow: hidden
        }

        .sk-g {
            display: grid;
            gap: 12px;
            margin-bottom: 14px
        }

        .sk-g.c2 {
            grid-template-columns: 1fr 1fr
        }

        @media(min-width:900px) {
            .sk-g.c4 {
                grid-template-columns: repeat(4, 1fr)
            }
        }

        /* --- misc --- */
        .sec-t {
            font-family: 'Bricolage Grotesque', 'Hind Siliguri', sans-serif;
            font-size: 1.05rem;
            margin: 4px 2px 10px
        }

        .lst-h {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px
        }

        .sum-r {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            font-size: .86rem;
            color: var(--muted);
            margin: 2px 0 8px
        }

        .pos {
            color: var(--income)
        }

        .neg {
            color: var(--expense)
        }

        @media print {
            .rv {
                opacity: 1 !important
            }

            .rv.in,
            .rv {

        function toast(msg, type = 'info') {

        /* মডাল স্ট্যাক — ব্রাউজার/মোবাইলের back বাটন মডাল বন্ধ করবে */
        const modalStack = [];

        function openModal(html, cls = '') {
            const el = document.createElement('div');
            el.className = 'overlay ' + cls;
            el._opener = document.activeElement;
            el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab" aria-hidden="true"></div>${html}</div>`;
            el.addEventListener('mousedown', e => {
                if (e.target === el) closeModals(1);
            });
            const sh = el.firstElementChild;
            attachSwipe(el, sh);
            $('#modals').appendChild(el);
            modalStack.push(el);
            document.body.classList.add('lock');
            history.pushState({
                m: modalStack.length
            }, '');
            requestAnimationFrame(() => el.classList.add('show'));
            if (!cls.includes('cmd')) {
                sh.setAttribute('tabindex', '-1');
                setTimeout(() => sh.focus({
                    preventScroll: true
                }), 60);
            }
            return sh;
        }

        function closeModals(n = 1) {
            if (modalStack.length) history.go(-Math.min(n, modalStack.length));
        }
        window.addEventListener('popstate', () => {
            const depth = (history.state && history.state.m) || 0;
            while (modalStack.length > depth) {
                const el = modalStack.pop();
                el.classList.remove('show');
                if (el._onclose) el._onclose();
                setTimeout(() => el.remove(), 260);
                if (el._opener && el._opener.isConnected && el._opener.focus) el._opener.focus({
                    preventScroll: true
                });
            }
            if (!modalStack.length) document.body.classList.remove('lock');
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && modalStack.length) closeModals(1);
        });

        function confirmBox(msg, okLabel) {
            return new Promise(res => {
                let done = false;
                const m = openModal(`<h2>${esc(msg)}</h2><div class="acts"><button class="btn" data-c="0">${t('cancel')}</button><button class="btn danger" data-c="1">${esc(okLabel || t('yes'))}</button></div>`);
                m.parentElement._onclose = () => {
                    if (!done) {
                        done = true;
                        res(false);
                    }
                };
                m.querySelectorAll('[data-c]').forEach(b => b.onclick = async () => {
                    const ok = b.dataset.c === '1';
                    done = true;
                    closeModals(1);
                    await sleep(90);

                });
            });

        /* =====================================================================
           ৬. চার্ট (হালকা SVG — বাইরের লাইব্রেরি ছাড়া)

        const compact = n => nfmt(n, {
            notation: 'compact',
