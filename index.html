        function barChart(labels, series) {
            const W = 360,
                H = 190,
                pl = 4,
                pr = 4,
                pt = 14,
                pb = 24,
                n = labels.length,
                k = series.length,
                ch = H - pt - pb;
            const max = Math.max(1, ...series.flatMap(s => s.data));
            const gw = (W - pl - pr) / n,
                bw = Math.max(1.5, Math.min(20, gw * .72 / k));
            let g = '';
            for (let i = 0; i <= 3; i++) {
                const y = pt + ch * i / 3;
                g += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" class="gl"/>`;
            }
            series.forEach((s, si) => s.data.forEach((v, i) => {
                if (v <= 0) return;
                const h = Math.max(1, ch * v / max),
                    x = pl + gw * i + (gw - bw * k) / 2 + bw * si;
                g += `<rect x="${x.toFixed(1)}" y="${(pt + ch - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${s.color}"><title>${esc(labels[i])}: ${money(v)}</title></rect>`;
            }));
            const step = Math.ceil(n / 6);
            labels.forEach((l, i) => {
                if (i % step === 0) g += `<text x="${(pl + gw * i + gw / 2).toFixed(1)}" y="${H - 7}" class="ax" text-anchor="middle">${esc(l)}</text>`;
            });
            g += `<text x="2" y="9" class="ax">${compact(max)}</text>`;
            return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">${g}</svg>`;
        }

        function lineChart(labels, data, color) {
            const W = 360,
                H = 190,
                pl = 8,
                pr = 8,
                pt = 16,
                pb = 24,
                n = data.length;
            const mx = Math.max(0, ...data),
                mn = Math.min(0, ...data),
                rg = (mx - mn) || 1;
            const X = i => pl + (n > 1 ? i * (W - pl - pr) / (n - 1) : (W - pl - pr) / 2),
                Y = v => pt + (H - pt - pb) * (mx - v) / rg;
            const pts = data.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
            let g = `<line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" class="gl"/>`;
            g += `<path d="M${X(0)},${Y(0)} L${pts.join(' L')} L${X(n - 1)},${Y(0)}Z" fill="${color}" opacity=".15"/><polyline pathLength="1" points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>`;
            data.forEach((v, i) => {
                g += `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3" fill="${color}"><title>${esc(labels[i])}: ${money(v)}</title></circle>`;
            });
            const step = Math.ceil(n / 6);
            labels.forEach((l, i) => {
                if (i % step === 0) g += `<text x="${X(i).toFixed(1)}" y="${H - 7}" class="ax" text-anchor="middle">${esc(l)}</text>`;
            });
            g += `<text x="2" y="9" class="ax">${compact(mx)}</text>`;
            return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">${g}</svg>`;
        }

        function donutSvg(items, total) {
            let off = 0;
            const segs = items.map(it => {
                const p = it.value / total * 100;
                const a = it.key ? ` data-act="catFilter" data-id="${esc(it.key)}"${it.from ? ` data-from="${it.from}" data-to="${it.to}"` : ''} style="cursor:pointer"` : '';
                const s = `<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${it.color}" stroke-width="6" stroke-dasharray="${p.toFixed(2)} ${(100 - p).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 21 21)"${a}><title>${esc(it.label)}: ${money(it.value)}</title></circle>`;
                off += p;
                return s;
            }).join('');
            return `<svg viewBox="0 0 42 42" role="img" class="dsvg">${segs}<text x="21" y="22.5" text-anchor="middle" class="dt">${compact(total)}</text></svg>`;
        }

        function donut(items) {
            const total = items.reduce((a, b) => a + b.value, 0);
            if (!total) return `<div class="empty">${t('noData')}</div>`;
            return `<div class="donut">${donutSvg(items, total)}<ul class="legend">${items.map(it => `<li${it.key ? ` data-act="catFilter" data-id="${esc(it.key)}"${it.from ? ` data-from="${it.from}" data-to="${it.to}"` : ''} tabindex="0" role="button" style="cursor:pointer"` : ''}><i style="background:${it.color}"></i><span>${esc(it.label)}</span><b>${pct(it.value / total * 100)}</b></li>`).join('')}</ul></div>`;

        /* মিনি স্পার্কলাইন (হিরো / বাজেট) */
        function sparkSvg(data, o = {}) {
            const {
                h = 72, stroke = '#fff', fill = 'rgba(255,255,255,.18)', line = null, cls = ''
            } = o;
            const W = 300,
                n = data.length;
            const all = line != null ? data.concat([line]) : data;
            const mx = Math.max(...all),
                mn = Math.min(...all),
                flat = mx === mn,
                rg = (mx - mn) || 1;
            const X = i => n > 1 ? i * W / (n - 1) : W / 2,
                Y = v => flat ? h * .6 : 6 + (h - 14) * (mx - v) / rg;
            const pts = data.map((v, i) => X(i).toFixed(1) + ',' + Y(v).toFixed(1));
            return `<svg class="spark ${cls}" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="M0,${h} L${pts.join(' L')} L${W},${h}Z" fill="${fill}"/>${line != null ? `<line x1="0" x2="${W}" y1="${Y(line).toFixed(1)}" y2="${Y(line).toFixed(1)}" stroke="${stroke}" stroke-opacity=".5" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>` : ''}<polyline pathLength="1" points="${pts.join(' ')}" fill="none" stroke="${stroke}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
        }
        const ring = (p, color, label) => `<svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15.9155" fill="none" stroke="var(--border)" stroke-width="3.5"/><circle class="rg" cx="18" cy="18" r="15.9155" fill="none" stroke="${color}" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${clamp(p || 0, 0, 100).toFixed(1)} 100" transform="rotate(-90 18 18)"/><text x="18" y="20.6" text-anchor="middle" class="rt">${label}</text></svg>`;

        /* =====================================================================

        const agg = list => {

        function walletStats() {

        const statBox = (cls, icon, label, val, vcls = '') => `<div class="stat"><div class="si ${cls}">${ic(icon, 18)}</div><small>${label}</small><b class="${vcls}">${val}</b></div>`;

        /* ---------- হোম: হিরো, কুইক অ্যাকশন, হেলথ, টাইমলাইন, ফ্লো ---------- */
        function balanceSeries(days = 30) { // গত ৩০ দিনের দৈনিক ব্যালেন্স
            const t0 = today(),
                start = addDays(t0, -(days - 1));
            let run = S.wallets.reduce((a, w) => a + w.opening, 0);

                    exp: 0
                })[x.type === 'income' ? 'inc' : 'exp'] += x.amount;
            });
            const by = {};
            S.txs.forEach(x => {
                const y = x.date.slice(0, 4);
                (by[y] = by[y] || {

                    exp: 0

        /* ---------- ইনসাইট পেজ: স্মার্ট ইনসাইট, হিটম্যাপ, সিমুলেটর ---------- */
        function heatBody() {
            const k = S.ui.heat,
                now = new Date(),
                t0 = today();
            let from, to;
            if (k === 'm') {
                const mk = mkey(now);
                from = mk + '-01';
                to = mk + '-' + pad(daysIn(mk));
            } else if (k === 'pm') {
                const mk = prevMonthKey(mkey(now));
                from = mk + '-01';
                to = mk + '-' + pad(daysIn(mk));
            } else if (k === 'q') {
                from = ymd(new Date(now.getFullYear(), now.getMonth() - 2, 1));
                const mk = mkey(now);
                to = mk + '-' + pad(daysIn(mk));
            } else {
                from = now.getFullYear() + '-01-01';
                to = now.getFullYear() + '-12-31';
            }
            const dm = {};
            S.txs.forEach(x => {
                if (x.type === 'expense' && x.date >= from && x.date <= to) dm[x.date] = (dm[x.date] || 0) + x.amount;
            });
            const mx = Math.max(0, ...Object.values(dm));
            let cells = '<i class="x"></i>'.repeat(parseYmd(from).getDay()),
                active = 0,
                free = 0,
                total = 0,
                maxD = null;
            for (let d = from; d <= to; d = addDays(d, 1)) {
                const v = dm[d] || 0,
                    fut = d > t0;
                if (!fut) {
                    if (v) active++;
                    else free++;
                }
                total += v;
                if (v && (!maxD || v > dm[maxD])) maxD = d;
                const lvl = v ? clamp(Math.ceil(v / mx * 4), 1, 4) : 0;
                cells += `<i class="${fut ? 'f ' : ''}l${lvl}" data-act="heatSel" data-id="${d}" data-v="${v}" title="${esc(fdate(d))}: ${esc(money(v))}"></i>`;
            }
            return `<div class="sum-r"><span>${t('heatTotal')}: <b>${money(total)}</b></span><span>${t('heatActive')}: <b>${nfmt(active)}</b></span><span>${t('heatFree')}: <b>${nfmt(free)}</b></span>${maxD ? `<span>${t('heatMax')}: <b>${fshort(maxD)}</b></span>` : ''}</div>
   <div class="scroll" id="heatScroll"><div class="heat" role="img" aria-label="${esc(t('heat'))}">${cells}</div></div>
   <div class="hleg"><span>${t('less')}</span><i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><span>${t('more')}</span></div><div id="heatInfo" class="note" style="margin-top:8px" aria-live="polite">${t('tapHeat')}</div>`;
        }

        function heatCard() {
            const k = S.ui.heat,

                ];
            return `<div class="head"><h3>${t('heat')}</h3></div><div class="chips">${opts.map(([id, l]) => `<button class="pchip ${k === id ? 'on' : ''}" data-act="heatRange" data-id="${id}">${t(l)}</button>`).join('')}</div>${heatBody()}`;

        function simBase() {
            const now = new Date(),
                per = [0, 1, 2].map(i => agg(S.txs.filter(x => x.date.startsWith(mkey(new Date(now.getFullYear(), now.getMonth() - i, 1)))))).filter(m => m.inc || m.exp);
            if (!per.length) return null;
            const n = per.length;
            return {
                n,
                net: per.reduce((a, m) => a + m.inc - m.exp, 0) / n,
                exp: per.reduce((a, m) => a + m.exp, 0) / n,
                inc: per.reduce((a, m) => a + m.inc, 0) / n
            };
        }

        function simHtml() {
            const b = simBase();
            if (!b) return emptyBox('pig', t('noData'), t('insNone'), 'addTx', t('addTx'));
            const mc = Math.max(100, Math.ceil(b.exp / 100) * 100),
                ma = Math.max(100, Math.ceil(b.inc / 100) * 100),
                sc = Math.max(1, Math.round(mc / 200)),
                sa = Math.max(1, Math.round(ma / 200));
            const sl = (key, label, max, st) => `<label>${label}</label><div class="sl"><input type="range" data-sim="${key}" min="0" max="${max}" step="${st}" value="0" aria-label="${esc(label)}"><input type="number" data-sim="${key}n" min="0" max="${max}" step="${st}" value="0" inputmode="decimal" aria-label="${esc(label)}"></div>`;
            return `<p class="note">${t('simBasis', { n: nfmt(b.n) })}</p>${sl('cut', t('simCut'), mc, sc)}${sl('add', t('simAdd'), ma, sa)}
   <div class="scroll" style="margin-top:10px"><table class="simt"><tr><th></th><th class="r">${t('simBase')}</th><th class="r">${t('simNew')}</th><th class="r">${t('simDiff')}</th></tr>${[[1, 'simMonth'], [3, 'sim3'], [6, 'sim6'], [12, 'sim12']].map(([n, l]) => `<tr><td>${t(l)}</td><td class="r"><span data-sc="${n}b"></span></td><td class="r"><b data-sc="${n}n"></b></td><td class="r pos"><span data-sc="${n}d"></span></td></tr>`).join('')}</table></div><small>${t('simNote')}</small>`;
        }

        function updateSim() {
            const b = simBase();
            if (!b) return;
            const cut = +($('[data-sim=cut]')?.value || 0),
                add = +($('[data-sim=add]')?.value || 0),
                m = b.net + cut + add;
            [1, 3, 6, 12].forEach(n => {
                tweenNum($(`[data-sc="${n}b"]`), b.net * n);
                tweenNum($(`[data-sc="${n}n"]`), m * n);
                tweenNum($(`[data-sc="${n}d"]`), (cut + add) * n);
            });
        }

   <div class="chap c3"><div class="big">${nfmt(list.length)}</div><small>${t('stCount')}</small><div class="cl" style="margin-top:auto"><span>${t('stDays')}</span><b>${nfmt(dset.size)}</b></div><div class="cl"><span>${t('stFree')}</span><b>${nfmt(free)}</b></div></div>
   <div class="chap c4"><small>${t('stVs')}</small><div class="cl"><span>${t('income')}</span><b>${df(dl(a.inc, p.inc))}</b></div><div class="cl"><span>${t('expense')}</span><b>${df(dl(a.exp, p.exp))}</b></div><div style="margin-top:auto;display:flex;align-items:center;gap:12px">${ring(clamp(rate, 0, 100), '#fff', pct(rate))}<div><small>${t('savingsRate')}</small><div class="big" style="font-size:1.3rem">${pct(rate)}</div></div></div></div></div>`;
        }

        function filteredItems(f = S.ui.f) {
            const q = (f.q || '').trim().toLowerCase(),
                min = parseFloat(f.min),
                max = parseFloat(f.max);
            let list = [];
            S.txs.forEach(x => {
                if (f.type && f.type !== x.type) return;
                if (f.cat && f.cat !== x.category) return;
                if (f.wallet && f.wallet !== x.walletId) return;
                if (f.method && f.method !== x.method) return;
                if (f.rcpt === '1' && !x.receiptUrl) return;
                list.push({
                    ...x,
                    kind: 'tx'
                });
            });
            if ((!f.type || f.type === 'transfer') && f.rcpt !== '1') S.transfers.forEach(x => {
                if (f.cat || f.method) return;
                if (f.wallet && f.wallet !== x.fromId && f.wallet !== x.toId) return;
                list.push({
                    ...x,
                    kind: 'tr'
                });
            });
            list = list.filter(x => (!q || (x.note || '').toLowerCase().includes(q) || catName(x.category || '').toLowerCase().includes(q)) && (!f.from || x.date >= f.from) && (!f.to || x.date <= f.to) && (isNaN(min) || x.amount >= min) && (isNaN(max) || x.amount <= max));
            const s = f.sort || 'new';
            list.sort(s === 'old' ? (a, b) => a.ts - b.ts : s === 'high' ? (a, b) => b.amount - a.amount : s === 'low' ? (a, b) => a.amount - b.amount : (a, b) => b.ts - a.ts);
            return list;
        }

        /* ---------- ক্যালেন্ডার (হিট ইনটেনসিটি + ড্রয়ার) ---------- */
        function pCalendar() {
            const tdy = today(),
                mk = S.ui.calMonth || (S.ui.calMonth = tdy.slice(0, 7)),
                [y, m] = mk.split('-').map(Number);
            const dim = new Date(y, m, 0).getDate(),
                off = new Date(y, m - 1, 1).getDay(),
                map = {};
            const ent = d => map[d] || (map[d] = {
                inc: 0,
                exp: 0,
                n: 0
            });
            S.txs.forEach(x => {
                if (x.date.startsWith(mk)) {
                    const o = ent(x.date);
                    x.type === 'income' ? o.inc += x.amount : o.exp += x.amount;
                    o.n++;
                }
            });
            S.transfers.forEach(x => {
                if (x.date.startsWith(mk)) ent(x.date).n++;
            });
            const mxE = Math.max(0, ...Object.values(map).map(o => o.exp));
            const wds = [...Array(7)].map((_, i) => new Intl.DateTimeFormat(loc(), {
                weekday: 'short'
            }).format(new Date(2023, 0, 1 + i)));
            let cells = wds.map(w => `<div class="wd">${w}</div>`).join('') + '<span></span>'.repeat(off);
            for (let d = 1; d <= dim; d++) {
                const ds = `${mk}-${pad(d)}`,
                    o = map[ds],
                    lvl = o && o.exp ? clamp(Math.ceil(o.exp / mxE * 4), 1, 4) : 0;

        /* ছবি ছোট করে base64 বানানো, তারপর ImgBB তে আপলোড */
        function fileToB64(file, max = 1600) {
            return new Promise((res, rej) => {
                const img = new Image(),
                    u = URL.createObjectURL(file);
                img.onload = () => {
                    const k = Math.min(1, max / Math.max(img.width, img.height)),
                        c = document.createElement('canvas');
                    c.width = Math.round(img.width * k);
                    c.height = Math.round(img.height * k);
                    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                    URL.revokeObjectURL(u);
                    res(c.toDataURL('image/jpeg', .85).split(',')[1]);
                };
                img.onerror = () => {
                    URL.revokeObjectURL(u);
                    rej(new Error('img'));
                };
                img.src = u;
            });
        }
        /* XHR দিয়ে আপলোড — যাতে প্রগ্রেস দেখানো যায় */
        function uploadB64(b64, onProg) {
            return new Promise((res, rej) => {
                const fd = new FormData();
                fd.append('image', b64);
                const x = new XMLHttpRequest();
                x.open('POST', `${IMGBB_URL}?key=${encodeURIComponent(IMGBB_API_KEY)}`);
                x.timeout = 45000;
                x.upload.onprogress = e => {
                    if (e.lengthComputable && onProg) onProg(Math.round(e.loaded / e.total * 100));
                };
                x.onload = () => {
                    try {
                        const j = JSON.parse(x.responseText),
                            u = j.data && (j.data.display_url || j.data.url);
                        if (j.success && /^https:\/\//.test(u)) res(u);
                        else rej(new Error('imgbb'));
                    } catch (e) {
                        rej(e);
                    }
                };
                x.onerror = x.ontimeout = () => rej(new Error('net'));
                x.send(fd);
            });
        }
        const uploadReceipt = (file, onProg) => fileToB64(file).then(b => uploadB64(b, onProg));
        /* প্রোফাইল ছবি: মাঝখান থেকে স্কোয়ার ক্রপ করে ছোট করা */
        function fileToSquareB64(file, size = 320) {
            return new Promise((res, rej) => {
                const img = new Image(),

                    const s = Math.min(img.width, img.height),
                        c = document.createElement('canvas');
                    c.width = c.height = size;
                    c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
                    URL.revokeObjectURL(u);
                    res(c.toDataURL('image/jpeg', .88).split(',')[1]);
                };
                img.onerror = () => {
                    URL.revokeObjectURL(u);
                    rej(new Error('img'));
                };
                img.src = u;
            });

        function insights() {

                now = new Date(),

            const mo = agg(S.txs.filter(x => x.date.startsWith(mk))),
                pv = agg(S.txs.filter(x => x.date.startsWith(pm)));

            if (cats.length) out.push(['🏆', t('insTop', {

            })]);

                out.push([ch >= 0 ? '📈' : '📉', t(ch >= 0 ? 'insUp' : 'insDown', {
                    p: nfmt(Math.abs(Math.round(ch)))
                })]);
            }
            S.budgets.forEach(b => {
                const s = budgetStatus(b, mk);
                if (s.st === 'over') out.push(['🎯', t('insOver', {
                    c: catName(b.category)
                })]);
                else if (s.p >= 50) out.push(['🎯', t('insBudget', {
                    p: nfmt(Math.round(s.p)),
                    c: catName(b.category)
                })]);
            });
            const days = {};
            S.txs.forEach(x => {
                if (x.type === 'expense' && x.date.startsWith(mk)) days[x.date] = (days[x.date] || 0) + x.amount;
            });
            const dk = Object.keys(days);
            if (dk.length) {
                out.push(['🌿', t('insFree', {
                    n: nfmt(Math.max(0, now.getDate() - dk.length))
                })]);
                const hd = dk.sort((a, b) => days[b] - days[a])[0];
                out.push(['📅', t('insHighDay', {
                    d: fdate(hd),
                    a: money(days[hd])
                })]);
            }
            if (mo.exp > 0) out.push(['🗓️', t('insAvg', {
                a: money(mo.exp / now.getDate())
            })]);
            if (mo.inc > 0) out.push(['💡', t('insRate', {
                p: nfmt(Math.round((mo.inc - mo.exp) / mo.inc * 100))
            })]);
            return out;
        }

        /* ---- কমান্ড প্যালেট (Ctrl+K) — সহজ ন্যাচারাল-ল্যাঙ্গুয়েজ কুয়েরি ---- */
        const MN = [
            ['jan', 'january', 'জানুয়ারি'],
            ['feb', 'february', 'ফেব্রুয়ারি'],
            ['mar', 'march', 'মার্চ'],
            ['apr', 'april', 'এপ্রিল'],
            ['may', 'may', 'মে'],
            ['jun', 'june', 'জুন'],
            ['jul', 'july', 'জুলাই'],
            ['aug', 'august', 'আগস্ট'],
            ['sep', 'september', 'সেপ্টেম্বর'],
            ['oct', 'october', 'অক্টোবর'],
            ['nov', 'november', 'নভেম্বর'],
            ['dec', 'december', 'ডিসেম্বর']
        ];
        const STOP = new Set(['in', 'on', 'of', 'the', 'my', 'for', 'all', 'show', 'me', 'and', 'a', 'to', 'from', 'with', 'than']);

        function parseQuery(raw) {
            let q = ' ' + raw.toLowerCase().replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d)).replace(/\s+/g, ' ').trim() + ' ';
            const f = {},
                chips = [];
            const take = (re, fn) => {
                const m = q.match(re);
                if (!m) return false;
                q = q.replace(re, ' ');
                fn(m);
                return true;
            };
            take(/\s(?:above|over|more than|greater than|bigger than|>|উপরে|বেশি|বেশী)\s*(?:৳|tk|\$)?\s*([\d,]+(?:\.\d+)?)/, m => {
                f.min = m[1].replace(/,/g, '');
                chips.push('≥ ' + money(+f.min));
            });
            take(/\s(?:below|under|less than|smaller than|<|নিচে|কম)\s*(?:৳|tk|\$)?\s*([\d,]+(?:\.\d+)?)/, m => {
                f.max = m[1].replace(/,/g, '');
                chips.push('≤ ' + money(+f.max));
            });
            const now = new Date(),
                t0 = today(),
                mk = mkey(now),
                rng = (a, b, l) => {
                    f.from = a;
                    f.to = b;
                    chips.push(l);
                };
            if (!(take(/\s(?:today|আজ|আজকে)(?=\s)/, () => rng(t0, t0, t('today'))) || take(/\s(?:yesterday|গতকাল)(?=\s)/, () => rng(addDays(t0, -1), addDays(t0, -1), t('yesterday'))) ||
                    take(/\s(?:this month|এই মাস|এ মাস)(?=\s)/, () => rng(mk + '-01', mk + '-31', t('thisMonth'))) || take(/\s(?:last month|গত মাস)(?=\s)/, () => {
                        const p = prevMonthKey(mk);
                        rng(p + '-01', p + '-31', t('lastMonth'));
                    }) ||
                    take(/\s(?:this week|এই সপ্তাহ)(?=\s)/, () => rng(addDays(t0, -6), t0, '7d')) || take(/\s(?:last week|গত সপ্তাহ)(?=\s)/, () => rng(addDays(t0, -13), addDays(t0, -7), '−7d')) ||
                    take(/\s(?:this year|এই বছর|এ বছর)(?=\s)/, () => rng(now.getFullYear() + '-01-01', now.getFullYear() + '-12-31', String(now.getFullYear()))) || take(/\s(?:last year|গত বছর)(?=\s)/, () => rng((now.getFullYear() - 1) + '-01-01', (now.getFullYear() - 1) + '-12-31', String(now.getFullYear() - 1))) ||
                    take(/\slast (\d{1,3}) days(?=\s)/, m => rng(addDays(t0, -(+m[1] - 1)), t0, m[1] + 'd')))) {
                for (let i = 0; i < 12; i++) {
                    const re = new RegExp('\\s(?:' + MN[i].join('|') + ')(?:\\s+(\\d{4}))?(?=\\s)');
                    if (take(re, m => {
                            const y = m[1] ? +m[1] : (i > now.getMonth() ? now.getFullYear() - 1 : now.getFullYear()),
                                k = y + '-' + pad(i + 1);
                            rng(k + '-01', k + '-31', mname(k));
                        })) break;
                }
            }
            if (take(/\s(?:incomes?|earned|earnings?|আয়)(?=\s)/, () => {
                    f.type = 'income';
                    chips.push(t('income'));
                })) {
                /* income */
            } else if (take(/\s(?:expenses?|spent|spending|costs?|খরচ)(?=\s)/, () => {
                    f.type = 'expense';
                    chips.push(t('expense'));
                })) {
                /* expense */
            }
            let best = null,
                bl = 0;
            [...allCats('income'), ...allCats('expense')].forEach(c => {
                const d = D['c_' + c.name] || [];
                [c.name, d[0], d[1]].filter(Boolean).map(s => s.toLowerCase()).forEach(n => {
                    if (n.length >= 2 && n.length > bl && q.includes(' ' + n)) {
                        best = {
                            c,
                            n
                        };
                        bl = n.length;
                    }
                });
            });
            if (best) {
                f.cat = best.c.name;
                chips.push(catName(best.c.name));
                q = q.replace(' ' + best.n, ' ');
                if (!f.type) f.type = catType(best.c.name);
            }
            const wl = S.wallets.filter(w => w.name.length >= 2 && q.includes(' ' + w.name.toLowerCase())).sort((a, b) => b.name.length - a.name.length)[0];
            if (wl) {
                f.wallet = wl.id;
                chips.push(wl.name);
                q = q.replace(' ' + wl.name.toLowerCase(), ' ');
            }
            const left = q.split(' ').filter(w => w && !STOP.has(w)).join(' ');
            if (left) f.q = left;
            return {
                f,
                chips
            };
        }

                    const ws = walletStats();
                    S.wallets.filter(w => w.name.toLowerCase().includes(ql)).slice(0, 3).forEach(w => add(t('cmdWallets'), 'wallet', w.name, money(ws[w.id].bal), () => go('wallets')));
                    [...allCats('expense'), ...allCats('income')].filter(c => catName(c.name).toLowerCase().includes(ql)).slice(0, 4).forEach(c => add(t('cmdCats'), c.icon, catName(c.name), t(catType(c.name)), () => applyFilters({
                        type: catType(c.name),
                        cat: c.name
                    })));
                    ACT.filter(([k]) => t(k).toLowerCase().includes(ql)).forEach(([k, i, fn]) => add(t('cmdActions'), i, t(k), '', fn));
                    NAV.filter(([p]) => t('n_' + p).toLowerCase().includes(ql)).forEach(([p, i]) => add(t('cmdPages'), i, t('n_' + p), '', () => go(p)));
                }
                idx = Math.min(idx, Math.max(0, items.length - 1));
                let last = '';
                list.innerHTML = (items.length ? items.map((it, i) => {
                    const h = it.g !== last ? `<div class="cmg">${esc(it.g)}</div>` : '';
                    last = it.g;
                    return h + `<button class="cmi ${i === idx ? 'act' : ''}" data-i="${i}" role="option" aria-selected="${i === idx}"><span class="ico ex" style="background:var(--solid2)">${IC[it.icon] ? ic(it.icon, 18) : it.icon}</span><span class="rb"><b>${esc(it.title)}</b>${it.sub ? `<small>${esc(it.sub)}</small>` : ''}</span>${it.amt || ''}</button>`;
                }).join('') : `<div class="empty" style="padding:26px"><b>${t('cmdNone')}</b></div>`) + `<div class="note" style="padding:10px 12px">${t('cmdHint')}</div>`;
            };
            const mark = () => {
                $$('.cmi', list).forEach((b, i) => {
                    b.classList.toggle('act', i === idx);
                    b.setAttribute('aria-selected', i === idx);
                });
                $$('.cmi', list)[idx]?.scrollIntoView({
                    block: 'nearest'
                });
            };
            inp.addEventListener('input', () => {
                idx = 0;
                draw();
            });
            inp.addEventListener('keydown', e => {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    idx = Math.min(items.length - 1, idx + 1);

                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    idx = Math.max(0, idx - 1);
                    mark();
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (items[idx]) run(items[idx].fn);
                }
            });
            list.addEventListener('click', e => {
                const b = e.target.closest('.cmi');
                if (b && items[+b.dataset.i]) run(items[+b.dataset.i].fn);
            });
            draw();
            setTimeout(() => inp.focus(), 140);
        }

        /* ---- বটম-শিট সোয়াইপ-টু-ক্লোজ ---- */
        function attachSwipe(ov, sh) {
            let y0 = null,
                dy = 0;
            ov.addEventListener('touchstart', e => {
                if (innerWidth >= 700 || ov.classList.contains('viewer') || ov.classList.contains('cmd')) return;
                const y = e.touches[0].clientY;
                if (y - sh.getBoundingClientRect().top < 64 && sh.scrollTop <= 0) {
                    y0 = y;
                    dy = 0;
                    sh.style.transition = 'none';
                }
            }, {
                passive: true
            });
            ov.addEventListener('touchmove', e => {
                if (y0 === null) return;
                dy = Math.max(0, e.touches[0].clientY - y0);
                sh.style.transform = `translateY(${dy}px)`;
            }, {
                passive: true
            });
            ov.addEventListener('touchend', () => {
                if (y0 === null) return;
                sh.style.transition = '';
                if (dy > 110) closeModals(1);
                else sh.style.transform = '';
                y0 = null;
                dy = 0;
            });
        }
        /* ---- পুল-টু-রিফ্রেশ ---- */
        const ptr = {
            y: 0,
            on: false,
            d: 0
        };
        const setPtr = d => {
            const el = $('#ptr');
            if (!el) return;
            el.style.transform = `translate(-50%,${d ? d - 60 : -70}px)`;
            el.style.opacity = d ? Math.min(1, d / 80) : 0;

        /* =====================================================================
           ১১. রিকারিং ট্রানজ্যাকশন (ডুপ্লিকেট ছাড়া, ডিটারমিনিস্টিক ID)
           ===================================================================== */
        function nextDate(r, due) {
            const d = parseYmd(due),
                b = parseYmd(r.startDate);
            if (r.freq === 'daily') return addDays(due, 1);
            if (r.freq === 'weekly') return addDays(due, 7);
            let y = d.getFullYear(),
                mo = d.getMonth() + (r.freq === 'monthly' ? 1 : 0);
            if (r.freq === 'yearly') y++;
            y += Math.floor(mo / 12);
            mo = ((mo % 12) + 12) % 12;
            return ymd(new Date(y, mo, Math.min(b.getDate(), new Date(y, mo + 1, 0).getDate())));
        }
        async function processRecurring() {
            const tdy = today();
            const have = new Set(S.txs.map(x => x.id));
            let added = 0;
            for (const r of S.recs) {
                if (!r.active) continue;
                let due = r.nextDue,
                    guard = 0;
                const ops = [];
                const news = [];
                const w = walletOf(r.walletId) ? r.walletId : S.wallets[0]?.id;
                if (!w) continue;
                while (due <= tdy && guard++ < 120) {
                    const id = `r_${r.id}_${due}`;
                    if (!have.has(id)) {
                        const time = '09:00';
                        const rec = {
                            type: r.type,
                            amount: r.amount,
                            category: r.category,
                            date: due,
                            time,
                            ts: mkTs(due, time),
                            method: r.method,
                            walletId: w,
                            note: r.note || '',
                            createdAt: Date.now(),
                            recId: r.id
                        };
                        ops.push(['set', dref('transactions', id), rec]);
                        news.push({
                            id,
                            ...rec
                        });
                    }
                    due = nextDate(r, due);
                }
                if (ops.length || due !== r.nextDue) {
                    const upd = {
                        ...r
                    };
                    delete upd.id;
                    upd.nextDue = due;
                    ops.push(['set', dref('recurring', r.id), upd]);
                    await commitOps(ops);
                    news.forEach(n => {
                        have.add(n.id);
                        upsert('txs', n);
                    });
                    r.nextDue = due;
                    added += news.length;
                }
            }
            if (added) toast(t('recProcessed', {
                n: nfmt(added)
            }), 'success');
        }

        function download(name, mime, text) {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([text], {
                type: mime
            }));
            a.download = name;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                URL.revokeObjectURL(a.href);
                a.remove();
            }, 500);
        }
        const csvCell = v => {
            let s = String(v ?? '');
            if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
            return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
        }; // CSV ইনজেকশন প্রতিরোধ
        function exportCsv(scope) {
            const list = scope === 'month' ? S.txs.filter(x => x.date.startsWith(S.ui.repMonth || today().slice(0, 7))) : S.txs;
            const rows = [
                ['Date', 'Time', 'Type', 'Category', 'Amount', 'Wallet', 'Method', 'Note', 'Receipt']
            ].concat(list.map(x => [x.date, x.time, x.type, catName(x.category), x.amount, walletOf(x.walletId)?.name || '', x.method, x.note, x.receiptUrl || '']));
            download(`transactions-${today()}.csv`, 'text/csv;charset=utf-8', '\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n'));
            toast(t('saved'), 'success');
        }

        function exportJson() {
            const strip = a => a.map(x => ({
                ...x
            }));
            const data = {
                app: 'ortho-kutir',
                version: 1,
                exportedAt: new Date().toISOString(),
                settings: cleanSettings(),
                wallets: strip(S.wallets),
                categories: strip(S.cats),
                budgets: strip(S.budgets),
                recurring: strip(S.recs),
                transactions: strip(S.txs),
                transfers: strip(S.transfers)
            };
            download(`ortho-kutir-backup-${today()}.json`, 'application/json', JSON.stringify(data, null, 2));
            toast(t('saved'), 'success');
        }
        /* ইমপোর্ট ভ্যালিডেশন: শুধু হোয়াইটলিস্ট করা ফিল্ড গ্রহণ */
        const vStr = (v, mn, mx) => typeof v === 'string' && v.length >= mn && v.length <= mx;
        const vNum = v => typeof v === 'number' && isFinite(v) && v >= 0 && v <= 1e12;

        function cleanTx(x) {
            if (!x || !['income', 'expense'].includes(x.type) || !vNum(x.amount) || x.amount <= 0 || !vStr(x.category, 1, 40) || !isDate(x.date) || !isTime(x.time) || !vStr(x.method || 'Cash', 1, 20)) return null;
            const o = {
                type: x.type,
                amount: r2(x.amount),
                category: x.category,
                date: x.date,
                time: x.time,
                ts: mkTs(x.date, x.time),
                method: x.method || 'Cash',
                walletId: '',
                note: typeof x.note === 'string' ? x.note.slice(0, 300) : '',
                createdAt: Date.now()
            };
            if (typeof x.receiptUrl === 'string' && /^https:\/\//.test(x.receiptUrl) && x.receiptUrl.length <= 500) o.receiptUrl = x.receiptUrl;
            return o;
        }
        async function importJson(file) {
            let data;
            try {
                if (file.size > 8e6) throw 0;
                data = JSON.parse(await file.text());
                if (!data || typeof data !== 'object' || data.app !== 'ortho-kutir') throw 0;
            } catch (e) {
                return toast(t('vJson'), 'error');
            }
            const arr = k => Array.isArray(data[k]) ? data[k].slice(0, MAX_LOAD) : [];
            const wmap = {};
            const ops = [];
            let count = 0;
            for (const w of arr('wallets')) {
                if (!w || !vStr(w.name, 1, 40) || !Object.keys(KINDS).includes(w.kind) || !vNum(w.opening)) continue;
                const ex = S.wallets.find(x => x.name.toLowerCase() === w.name.toLowerCase());
                if (ex) {
                    wmap[w.id] = ex.id;
                    continue;
                }
                const id = newId('wallets'),
                    rec = {
                        name: w.name,
                        kind: w.kind,
                        opening: r2(w.opening),
                        createdAt: Date.now()
                    };
                wmap[w.id] = id;
                ops.push(['set', dref('wallets', id), rec]);
                S.wallets.push({
                    id,
                    ...rec
                });
                count++;
            }
            for (const c of arr('categories')) {
                if (!c || !vStr(c.name, 1, 30) || /[\/\\]/.test(c.name) || !['income', 'expense'].includes(c.type) || !vStr(c.icon || '🏷️', 1, 8) || isDefCat(c.name) || S.cats.some(x => x.name.toLowerCase() === c.name.toLowerCase())) continue;
                const id = newId('categories'),
                    rec = {
                        name: c.name,
                        type: c.type,
                        icon: c.icon || '🏷️',
                        createdAt: Date.now()
                    };
                ops.push(['set', dref('categories', id), rec]);
                S.cats.push({
                    id,
                    ...rec
                });
                count++;
            }
            for (const b of arr('budgets')) {
                if (!b || !vStr(b.category, 1, 40) || !vNum(b.amount) || b.amount <= 0 || S.budgets.some(x => x.category === b.category)) continue;
                const id = newId('budgets'),
                    rec = {
                        category: b.category,
                        amount: r2(b.amount),
                        createdAt: Date.now()
                    };
                ops.push(['set', dref('budgets', id), rec]);
                S.budgets.push({
                    id,
                    ...rec
                });
                count++;
            }
            const sig = x => [x.ts, x.amount, x.type || 'tr', x.category || '', x.walletId || x.fromId].join('|');
            const seen = new Set(S.txs.map(sig));
            const seenT = new Set(S.transfers.map(x => [x.ts, x.amount, x.fromId, x.toId].join('|')));
            for (const x of arr('transactions')) {
                const o = cleanTx(x);
                if (!o) continue;
                o.walletId = wmap[x.walletId] || walletOf(x.walletId)?.id || '';
                if (!o.walletId) continue;
                const s = sig(o);
                if (seen.has(s)) continue;
                seen.add(s);
                const id = newId('transactions');
                ops.push(['set', dref('transactions', id), o]);
                S.txs.push({
                    id,
                    ...o
                });
                count++;
            }
            for (const x of arr('transfers')) {
                if (!x || !vNum(x.amount) || x.amount <= 0 || !isDate(x.date) || !isTime(x.time)) continue;
                const from = wmap[x.fromId] || walletOf(x.fromId)?.id,
                    to = wmap[x.toId] || walletOf(x.toId)?.id;
                if (!from || !to || from === to) continue;
                const ts = mkTs(x.date, x.time);
                const s = [ts, r2(x.amount), from, to].join('|');
                if (seenT.has(s)) continue;
                seenT.add(s);
                const id = newId('transfers'),
                    rec = {
                        fromId: from,
                        toId: to,
                        amount: r2(x.amount),
                        date: x.date,
                        time: x.time,
                        ts,
                        note: typeof x.note === 'string' ? x.note.slice(0, 300) : '',
                        createdAt: Date.now()
                    };
                ops.push(['set', dref('transfers', id), rec]);
                S.transfers.push({
                    id,
                    ...rec
                });
                count++;
            }
            if (!ops.length) return toast(t('importDone', {
                n: nfmt(0)
            }), 'warn');
            if (!(await confirmBox(t('importConfirm', {
                    n: nfmt(count)
                }), t('save')))) {
                await reloadAll();
                return;
            }
            try {
                await commitOps(ops);
                S.txs.sort((a, b) => b.ts - a.ts);
                S.transfers.sort((a, b) => b.ts - a.ts);
                toast(t('importDone', {
                    n: nfmt(count)
                }), 'success');
            } catch (e) {
                toast(errMsg(e), 'error');
                await reloadAll();
            }
            route();
        }

                } catch (e) {
                    toast(errMsg(e), 'error');
                }
            },
            exportCsv: id => exportCsv(id),
            exportJson: () => exportJson(),
            importJson: () => {
                $('#impfile').value = '';
                $('#impfile').click();
            },
            printReport: () => window.print(),
            logout: async () => {
                try {
                    await signOut(auth);
                    toast(t('saved'), 'success');
                } catch (e) {
                    toast(errMsg(e), 'error');
                }
            },
            deleteAccount: () => openDeleteAccount()
        };

        function shiftCal(n) {
            const [y, m] = S.ui.calMonth.split('-').map(Number);
            S.ui.calMonth = mkey(new Date(y, m - 1 + n, 1));
            S.ui.calSel = null;
            route();
        }
        document.addEventListener('click', e => {
            const el = e.target.closest('[data-act]');
            if (!el) return;
            const f = A[el.dataset.act];
            if (!f) return;
            if (el.tagName === 'A' && el.dataset.act !== 'logout') return;
            e.preventDefault?.();
            Promise.resolve(f(el.dataset.id, el, e)).catch(err => toast(errMsg(err), 'error'));
        });
        document.addEventListener('keydown', e => {
            if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('.row,.tli,.rimg,.legend li') && e.target.dataset.act) {
                e.preventDefault();
                e.target.click();
            }
        });
        /* ফিল্টার ইনপুট */
        let fTimer;
        document.addEventListener('input', e => {
            const el = e.target.closest('[data-f]');
            if (!el) return;
            S.ui.f[el.dataset.f] = el.value;
            S.ui.txLimit = PAGE_SIZE;
            clearTimeout(fTimer);
            fTimer = setTimeout(() => {
                const l = $('#txlist');
                if (l) l.innerHTML = txListHtml();
            }, 180);
        });
        document.addEventListener('change', e => {
            const el = e.target;
            if (el.matches?.('[data-f]')) {
                S.ui.f[el.dataset.f] = el.value;
                S.ui.txLimit = PAGE_SIZE;
                const l = $('#txlist');
                if (l) l.innerHTML = txListHtml();
            } else if (el.matches?.('[data-set]')) saveSetting(el.dataset.set, el.value);
            else if (el.matches?.('[data-rep]') && /^\d{4}-\d{2}$/.test(el.value)) {
                S.ui.repMonth = el.value;
                route();
            } else if (el.id === 'impfile' && el.files[0]) importJson(el.files[0]).catch(err => toast(errMsg(err), 'error'));
        });

        /* সেটিংস সেভ */
        function setLang(v, silent) {
            lang = v === 'en' ? 'en' : 'bn';
            LS.set('ok_lang', lang);
            document.documentElement.lang = lang;
            applyI18n();
            if (!silent && S.user) renderShell();
        }

        function setTheme(v) {
            document.documentElement.classList.add('tt');
            setTimeout(() => document.documentElement.classList.remove('tt'), 550);
            theme = v === 'dark' ? 'dark' : 'light';
            LS.set('ok_theme', theme);
            document.documentElement.dataset.theme = theme;
            $('#metaTheme').content = theme === 'dark' ? '#08120f' : '#0e3b36';
            updateToggles();
        }
        async function saveSetting(k, v, quick) {
            if (k === 'lang') setLang(v);
            else if (k === 'theme') setTheme(v);
            else S.settings[k] = v;
            if (k === 'lang' || k === 'theme') S.settings[k] = v;
            if (S.user && S.loaded) {
                try {
                    await setDoc(dref('settings', 'main'), cleanSettings());
                    if (!quick) toast(t('saved'), 'success');
                } catch (e) {
                    toast(errMsg(e), 'error');
                }
                route();
            }
        }

        function updateToggles() {
            ['', 'A'].forEach(x => {
                const l = $('#langBtn' + x),
                    th = $('#themeBtn' + x);
                if (l) l.innerHTML = `<b style="font-size:.78rem">${lang === 'bn' ? 'EN' : 'বাং'}</b>`;
                if (th) th.innerHTML = ic(theme === 'dark' ? 'sun' : 'moon', 20);
            });
            $$('.pw button').forEach(b => b.innerHTML = ic('eye', 20));
            const ta = $('#topAv');
            if (ta) {
                ta.innerHTML = S.user ? avatarHtml() : '';
                ta.setAttribute('aria-label', t('profile'));
            }
            const sb = $('#srchBtn'),
                sb2 = $('#searchBtn');
            if (sb) sb.innerHTML = `${ic('search', 18)}<span>${esc(t('cmdPh'))}</span><kbd>Ctrl K</kbd>`;
            if (sb2) {
                sb2.innerHTML = ic('search', 20);
                sb2.setAttribute('aria-label', t('srch'));
            }
        }

        function applyI18n() {
            $$('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
            document.title = t('appName') + ' · ' + t('tagline');
            updateToggles();
            $('#fab').innerHTML = ic('plus', 28);
            $('#fab').setAttribute('aria-label', t('addTx'));
            if (typeof updateStrength === 'function') updateStrength();
        }

        /* =====================================================================
           ১৪. অথেনটিকেশন (Email/Password + Google)
           ===================================================================== */
        function errMsg(e) {
            const M = {
                'auth/email-already-in-use': 'eEmailUsed',
                'auth/invalid-credential': 'eBadCred',
                'auth/wrong-password': 'eBadCred',
                'auth/user-not-found': 'eBadCred',
                'auth/invalid-email': 'eEmail',
                'auth/weak-password': 'eWeak',
                'auth/too-many-requests': 'eMany',
                'auth/network-request-failed': 'eNet',
                'auth/requires-recent-login': 'eRecent',
                'permission-denied': 'ePerm',
                'unavailable': 'eNet',
                'auth/user-disabled': 'eDisabled',
                'auth/unauthorized-domain': 'eDomain',
                'auth/operation-not-allowed': 'eProvider',
                'auth/admin-restricted-operation': 'eProvider'
            };
            return t(M[e?.code] || 'eGeneric');
        }

        function authView(v) {
            ['login', 'register', 'forgot'].forEach(x => $('#f-' + x).hidden = x !== v);
            $$('#auth .msg').forEach(m => m.hidden = true);
        }

        function authMsg(form, text, ok) {
            const m = $('.msg', form);
            m.textContent = text;
            m.className = 'msg ' + (ok ? 'ok' : 'err');
            m.hidden = !text;
        }

        function strengthScore(p) {
            return Math.min(4, (p.length >= 8) + (p.length >= 12) + (/[a-z]/.test(p) && /[A-Z]/.test(p)) + (/\d/.test(p)) + (/[^A-Za-z0-9]/.test(p)) - (p.length < 8 ? 1 : 0));
        }

        function updateStrength() {
            const p = $('#r-pw')?.value || '';
            const sc = p ? Math.max(1, strengthScore(p)) : 0;
            const cols = ['', '#d9483b', '#e08a00', '#84cc16', '#0f9d6b'];
            $$('#strength i').forEach((b, i) => b.style.background = i < sc ? cols[sc] : '');
            $('#strength small').textContent = sc ? t('s' + sc) : '';
        }
        $('#r-pw').addEventListener('input', updateStrength);

        async function googleLogin(btn) {
            busy(btn, true);
            try {
                await setPersistence(auth, browserLocalPersistence);
                await signInWithPopup(auth, gProvider);
                toast(t('loginOk'), 'success');
            } catch (e) {
                if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment'].includes(e.code)) {
                    try {
                        await signInWithRedirect(auth, gProvider);
                        return;
                    } catch (e2) {
                        e = e2;
                    }
                } // মোবাইলে পপআপ ব্লক হলে redirect
                if (!['auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(e.code)) {
                    const f = $('#f-login');
                    authView('login');
                    authMsg(f, errMsg(e));
                    toast(errMsg(e), 'error');
                }
            }
            busy(btn, false);
        }
        getRedirectResult(auth).then(r => {
            if (r?.user) toast(t('loginOk'), 'success');
        }).catch(e => {
            if (e.code !== 'auth/no-auth-event') toast(errMsg(e), 'error');
        });

        const FORMS = {
            'f-login': async f => {
                const email = f.email.value.trim(),
                    pw = f.password.value,
                    btn = $('button[type=submit]', f);
                authMsg(f, '');
                if (!EMAIL_RE.test(email)) return authMsg(f, t('eEmail'));
                if (!pw) return authMsg(f, t('vPw'));
                busy(btn, true);
                try {
                    await setPersistence(auth, f.remember.checked ? browserLocalPersistence : browserSessionPersistence);
                    await signInWithEmailAndPassword(auth, email, pw);
                    toast(t('loginOk'), 'success');
                } catch (e) {
                    authMsg(f, errMsg(e));
                    busy(btn, false);
                }
            },
            'f-register': async f => {
                const name = f.name.value.trim(),
                    email = f.email.value.trim(),
                    pw = f.password.value,
                    btn = $('button[type=submit]', f);
                authMsg(f, '');
                if (name.length < 2 || name.length > 60) return authMsg(f, t('vName'));
                if (!EMAIL_RE.test(email)) return authMsg(f, t('eEmail'));
                if (pw.length < 8 || !/[A-Za-z]/.test(pw) || !/\d/.test(pw)) return authMsg(f, t('vPw'));
                if (pw !== f.password2.value) return authMsg(f, t('vPwMatch'));
                busy(btn, true);
                S.pendingName = name;
                try {
                    await setPersistence(auth, browserLocalPersistence);
                    const c = await createUserWithEmailAndPassword(auth, email, pw);
                    await updateProfile(c.user, {
                        displayName: name
                    });
                    try {
                        await setDoc(doc(db, 'users', c.user.uid, 'profile', 'main'), {
                            name,
                            email,
                            createdAt: Date.now()
                        });
                        if (S.profile) S.profile.name = name;
                    } catch (e) {}
                    toast(t('regOk'), 'success');
                    if (S.loaded) route();
                } catch (e) {
                    authMsg(f, errMsg(e));
                    S.pendingName = '';
                    busy(btn, false);
                }
            },
            'f-forgot': async f => {
                const email = f.email.value.trim(),
                    btn = $('button[type=submit]', f);
                if (!EMAIL_RE.test(email)) return authMsg(f, t('eEmail'));
                busy(btn, true);
                try {
                    await sendPasswordResetEmail(auth, email);
                } catch (e) {
                    if (['auth/network-request-failed', 'auth/too-many-requests'].includes(e.code)) {
                        authMsg(f, errMsg(e));
                        busy(btn, false);
                        return;
                    }
                }
                authMsg(f, t('resetSent'), true);
                busy(btn, false);
            },
            'nameForm': async f => {
                const name = f.name.value.trim();
                const btn = $('button[type=submit]', f);
                if (name.length < 2 || name.length > 60) return fieldErr(f.name, t('vName'));
                busy(btn, true);
                try {
                    await updateProfile(S.user, {
                        displayName: name
                    });
                    S.profile = {
                        ...S.profile,
                        name
                    };
                    await saveProfile({
                        name
                    });
                    toast(t('saved'), 'success');
                    renderShell();
                    route();
                } catch (e) {
                    toast(errMsg(e), 'error');
                    busy(btn, false);
                }
            },
            'pwForm': async f => {
                const btn = $('button[type=submit]', f);
                if (!f.cur.value) return fieldErr(f.cur, t('vPw'));
                if (f.nw.value.length < 8 || !/[A-Za-z]/.test(f.nw.value) || !/\d/.test(f.nw.value)) return fieldErr(f.nw, t('vPw'));
                if (f.nw.value !== f.nw2.value) return fieldErr(f.nw2, t('vPwMatch'));
                busy(btn, true);
                try {
                    await reauthenticateWithCredential(S.user, EmailAuthProvider.credential(S.user.email, f.cur.value));
                    await updatePassword(S.user, f.nw.value);
                    toast(t('pwChanged'), 'success');
                    f.reset();
                } catch (e) {
                    toast(errMsg(e), 'error');
                }
                busy(btn, false);
            }
        };
        document.addEventListener('submit', e => {
            const h = FORMS[e.target.id];
            if (h) {
                e.preventDefault();
                h(e.target).catch(err => toast(errMsg(err), 'error'));
            }
        });

        /* অ্যাকাউন্ট মুছে ফেলা */
        function openDeleteAccount() {
            const pwu = isPwUser();
            const m = openModal(`<form id="delf" novalidate><h2>${t('deleteAcct')}</h2><p class="msg err">${t('deleteWarn')}</p>${pwu ? `<label>${t('password')}</label><input name="pw" type="password" autocomplete="current-password" maxlength="128">` : ''}<div class="acts"><button type="button" class="btn" data-act="closeM">${t('cancel')}</button><button class="btn danger" type="submit">${t('deleteAcct')}</button></div></form>`);
            const f = $('#delf', m);
            f.onsubmit = async e => {
                e.preventDefault();
                const btn = $('button[type=submit]', f);
                busy(btn, true);
                try {
                    if (pwu) {
                        if (!f.pw.value) {
                            busy(btn, false);
                            return fieldErr(f.pw, t('vPw'));
                        }
                        await reauthenticateWithCredential(S.user, EmailAuthProvider.credential(S.user.email, f.pw.value));
                    } else await reauthenticateWithPopup(S.user, gProvider);
                    for (const n of ['transactions', 'transfers', 'wallets', 'categories', 'budgets', 'recurring']) {
                        for (;;) {
                            const s = await getDocs(query(col(n), limit(400)));
                            if (s.empty) break;
                            await commitOps(s.docs.map(d => ['del', d.ref]));
                        }
                    }
                    await deleteDoc(dref('profile', 'main'));
                    await deleteDoc(dref('settings', 'main'));
                    const u = S.user;
                    modalStack.length && closeModals(modalStack.length);
                    await deleteUser(u);
                    toast(t('deleted'), 'success');
                } catch (err) {
                    toast(errMsg(err), 'error');
                    busy(btn, false);
                }
            };
        }

        /* =====================================================================
           ১৫. শেল, রাউটার (back বাটন সাপোর্ট সহ)
           ===================================================================== */
        const NAV = [
            ['home', 'home'],
            ['transactions', 'list'],
            ['wallets', 'wallet'],
            ['analytics', 'chart'],
            ['insights', 'bulb'],
            ['calendar', 'calendar'],
            ['budgets', 'target'],
            ['recurring', 'repeat'],
            ['reports', 'file'],
            ['settings', 'settings']
        ];
        const PAGES = {
            home: pHome,
            analytics: pAnalytics,
            transactions: pTransactions,
            calendar: pCalendar,
            wallets: pWallets,
            budgets: pBudgets,
            reports: pReports,
            settings: pSettings,
            more: pMore,
            insights: pInsights,
            recurring: pRecurring
        };

        function renderShell() {
            const name = S.profile?.name || S.user?.displayName || '';
            const av = avatarHtml();
            $('#sidebar').innerHTML = `<div class="logo"><img src="logo.png" alt="Ortho Kutir Logo" style="width: 40px; height: 40px; border-radius: 12px; object-fit: cover;"><div><b>${t('appName')}</b><small>${t('tagline')}</small></div></div>` + NAV.map(([p, i]) => `<a class="nv" href="#/${p}" data-p="${p}">${ic(i)}<span>${t('n_' + p)}</span></a>`).join('') + `<div class="who"><div class="avatar">${av}</div><div><b>${esc(name)}</b><small>${esc(S.user?.email || '')}</small></div></div>`;
            $('#bnav').innerHTML = [
                ['home', 'home'],
                ['analytics', 'chart'],
                ['transactions', 'list'],
                ['wallets', 'wallet'],
                ['more', 'more']
            ].map(([p, i]) => `<a href="#/${p}" data-p="${p}">${ic(i, 22)}<span>${t('n_' + p)}</span></a>`).join('');
            updateToggles();
            markNav();
        }

        function markNav() {
            const p = S.page;
            const mob = ['home', 'analytics', 'transactions', 'wallets'].includes(p) ? p : 'more';
            $$('#sidebar a.nv').forEach(a => a.classList.toggle('on', a.dataset.p === p));
            $$('#bnav a').forEach(a => a.classList.toggle('on', a.dataset.p === mob));
        }

        function route() {
            if (!S.user || !S.loaded) return;
            let p = location.hash.replace(/^#\/?/, '').split('?')[0];
            if (!PAGES[p]) {
                p = 'home';
                history.replaceState(history.state, '', '#/home');
            }
            S.page = p;
            $('#ptitle').textContent = t('n_' + p);
            markNav();
            try {
                $('#view').innerHTML = PAGES[p]();
            } catch (e) {
                console.error(e);
                $('#view').innerHTML = `<div class="card">${emptyBox('⚠️', t('eGeneric'))}</div>`;
            }
            $('#fab').hidden = p === 'settings' || p === 'more';
            window.scrollTo(0, 0);
            enter();
            if (p === 'insights') {
                updateSim();
                heatPost();
            }
        }
        window.addEventListener('hashchange', () => {
            while (modalStack.length) {
                const el = modalStack.pop();
                el.remove();
            }
            document.body.classList.remove('lock');
            route();
        }); // পেজ বদলালে খোলা মডাল বন্ধ

        /* ===== অথ স্টেট লিসেনার — লগইন থাকলে ড্যাশবোর্ড, না থাকলে অথ স্ক্রিন ===== */
        function resetState() {
            Object.assign(S, {
                user: null,
                profile: null,
                txs: [],
                transfers: [],
                wallets: [],
                cats: [],
                budgets: [],
                recs: [],
                loaded: false,
                pendingName: ''
            });
            S.ui = {
                txLimit: PAGE_SIZE,
                f: {
                    sort: 'new'
                },
                calMonth: null,
                calSel: null,
                repMonth: null,
                budTab: 'budgets',
                showFilters: false,
                an: '30d',
                anFrom: '',
                anTo: '',
                heat: 'm'
            };
            S.settings = {
                currency: 'BDT',
                lang: '',
                theme: '',
                defaultWallet: '',
                defaultCategory: ''
            };
        }
        onAuthStateChanged(auth, async u => {
            if (u) {
                if (S.user && S.user.uid === u.uid && S.loaded) {
                    S.user = u;
                    $('#boot').hidden = true;
                    return;
                }
                S.user = u;
                $('#auth').hidden = true;
                $('#app').hidden = false;
                $('#boot').hidden = true;
                renderShell();
                $('#ptitle').textContent = t('n_home');
                $('#view').innerHTML = skeleton(location.hash.replace(/^#\/?/, ''));
                try {
                    await loadAll();
                    renderShell();
                    await processRecurring();
                    if (!location.hash || location.hash === '#') history.replaceState(null, '', '#/home');
                    route();
                } catch (e) {
                    console.error(e);
                    toast(errMsg(e), 'error');
                    $('#view').innerHTML = `<div class="card">${emptyBox('⚠️', errMsg(e))}<button class="btn block" onclick="location.reload()">↻</button><button class="btn block" data-act="logout">${t('logout')}</button></div>`;
                }
            } else {
                resetState();
                $('#app').hidden = true;
                $('#auth').hidden = false;
                $('#boot').hidden = true;
                authView('login');
                $$('#auth form').forEach(f => f.reset?.());
                busy($('#googleBtn'), false);
                $$('#auth button[type=submit]').forEach(b => busy(b, false));
                updateStrength();
                history.replaceState(null, '', location.pathname + location.search);
            }
        });
        window.addEventListener('offline', () => toast(t('offline'), 'warn'));
        window.addEventListener('online', () => toast(t('online'), 'success'));

        /* ===== শুরু ===== */
        document.documentElement.dataset.theme = theme;
        setTheme(theme);
        setLang(lang, true);
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => {
                        console.log('Service Worker registered successfully with scope: ', reg.scope);
                    })
                    .catch(err => {
                        console.log('Service Worker registration failed: ', err);
                    });
            });
        }
    </script>

</body>

</html>
